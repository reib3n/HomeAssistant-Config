# Board: Generic ESP32-H2 Board (Generic)
# Definition: definitions/boards/generic-esp32h2/manifest.yaml

esphome:
  name: esp-thrd-btprox-ug
  friendly_name: Bluetooth Proxy UG

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_key

# Example OpenThread configuration (ESP32)
network:
  enable_ipv6: true

openthread:
  force_dataset: true
  tlv: !secret thread_tlv

esp32_ble_tracker:
  scan_parameters:
    interval: 160ms
    window: 80ms

bluetooth_proxy: