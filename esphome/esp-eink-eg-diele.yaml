# ---------------------------------------------------------
# Base / Boot
# ---------------------------------------------------------
esphome:
  name: "esp-eink-eg-diele"
  friendly_name: eInk Diele EG
  on_boot:
    priority: -100
    then:
      # Warten bis API + Zeit da sind (max. 3 min), dann kurz auf HA-Sensorwerte warten
      - wait_until:
          condition:
            and:
              - api.connected:
              - time.has_time:
          timeout: 180s
      - delay: 10s
      # Sonnenzeiten sofort berechnen (sonst erst nach dem regulaeren Update-Intervall)
      - component.update: next_sunrise
      - component.update: next_sunset
      - script.execute: refresh_display

esp32:
  board: esp32dev
  watchdog_timeout: 30s   # Spielraum fuer Display-Refresh (Standard 5s → Task-WDT-Crash)
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# ---------------------------------------------------------
# System / Communication
# ---------------------------------------------------------
logger:
  level: INFO            # Warnungen (z. B. "took a long time") und Crashes bleiben sichtbar
  hardware_uart: UART0   # USB-Serial (CP2102/CH340) → Web-Serial im Browser
  baud_rate: 115200

api:
  reboot_timeout: 60min   # HA-Updates/Backups nicht mit Reboot beantworten (Standard 15min)
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # kein Modem-Sleep → keine Latenz-/Paketverluste
  output_power: 17dB      # leicht reduziert, entlastet Versorgung bei TX-Spitzen

debug:
  update_interval: 60min

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Refresh zur vollen und halben Stunde (statt Intervall ab Boot)
      - seconds: 0
        minutes: /30
        then:
          - script.execute: refresh_display

sun:
  latitude: !secret latitude
  longitude: !secret longitude

# ---------------------------------------------------------
# User actions (Buttons)
# ---------------------------------------------------------
button:
  - platform: restart
    name: "eInk-EG-Diele - Restart"

  - platform: template
    name: "eInk-EG-Diele - Refresh Screen"
    entity_category: config
    on_press:
      # Manuell: immer aktualisieren (auch nachts)
      - component.update: eink_display

# ---------------------------------------------------------
# Colors (panel channels depend on Waveshare model)
#   Color(0,0,0,0)   = Weiss
#   Color(0,0,0,255) = Schwarz
#   Color(255,0,0,0) = Rot
# Feste Farben: Schwarz auf Weiss, auch Kopfzeile und Trennlinien.
# Rot nur als Signal fuer Ausnahmen, die Aufmerksamkeit brauchen
# (Frost, Muell heute, fehlende Daten) - an normalen Tagen kein Rot.
# Rot nur fuer fette/grosse Elemente: duenne Schrift verliert in Rot
# im lichtarmen Gang zu viel Kontrast.
# ---------------------------------------------------------
color:
  - id: COLOR_TEXT
    red: 0%
    green: 0%
    blue: 0%
    white: 100%

  - id: COLOR_BG
    red: 0%
    green: 0%
    blue: 0%
    white: 0%

  # Signalfarbe: Frost, Muell heute, Warnsymbol
  - id: COLOR_ACCENT
    red: 100%
    green: 0%
    blue: 0%
    white: 0%

# ---------------------------------------------------------
# Scripts (display refresh)
# ---------------------------------------------------------
script:
  # Refresh display between 06–23
  - id: refresh_display
    mode: queued
    then:
      - lambda: |-
          auto now = id(homeassistant_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("display", "Zeit noch nicht gueltig, Refresh uebersprungen");
            return;
          }
          int hour = now.hour;
          if (hour >= 6 && hour <= 23) {
            id(eink_display).update();
          }

