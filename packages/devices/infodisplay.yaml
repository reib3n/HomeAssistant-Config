        - name: "Forecast (12h) Timestamp"
          unique_id: forecast_12h_timestamp
          availability: >
            {{ forecast_data is defined
              and forecast_data['weather.freudenstadt'] is defined
              and (forecast_data['weather.freudenstadt'].forecast | length) > 12 }}
          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[12].datetime | as_datetime | as_local }}

    # ---------------------- BLOCK 2: GEMESSENE TAGESEXTREME ----------------------
    # Tiefst-/Höchstwert von sensor.temp_aussen_low seit 0 Uhr (heutiger Kalendertag).
    # Das Attribut "datum" markiert den Tag, zu dem der Wert gehört. Ist es nicht
    # heute (Mitternacht, HA war aus), beginnt der Wert neu bei der aktuellen Messung.
    # Der State ändert sich nur bei neuem Extremwert, daher kaum Recorder-Last trotz
    # häufiger Trigger.
    - trigger:
        - trigger: state
          entity_id: sensor.temp_aussen_low
        - trigger: time
          at: "00:00:00"
        - trigger: homeassistant
          event: start
      sensor:
        - name: "Aussentemp Tagesminimum"
          unique_id: aussentemp_tagesminimum
          state: >
            {% set t = states('sensor.temp_aussen_low') | float(None) %}
            {% set alt = this.state | float(None)
                 if this.attributes.get('datum') == now().date() | string else none %}
            {% set werte = [t, alt] | reject('none') | list %}
            {{ werte | min if werte else none }}
          attributes:
            datum: "{{ now().date() | string }}"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Aussentemp Tagesmaximum"
          unique_id: aussentemp_tagesmaximum
          state: >
            {% set t = states('sensor.temp_aussen_low') | float(None) %}
            {% set alt = this.state | float(None)
                 if this.attributes.get('datum') == now().date() | string else none %}
            {% set werte = [t, alt] | reject('none') | list %}
            {{ werte | max if werte else none }}
          attributes:
            datum: "{{ now().date() | string }}"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

    # ---------------------- BLOCK 3: DAILY FORECAST ----------------------
    - trigger:
        # stündlich zur vollen Stunde
        - trigger: time_pattern
          hours: "/1"
          minutes: "0"
        # zusätzlich nach HA-Start
        - trigger: homeassistant
          event: start
        # sofort nachziehen, wenn ein neuer gemessener Extremwert vorliegt
        - trigger: state
          entity_id:
            - sensor.aussentemp_tagesminimum
            - sensor.aussentemp_tagesmaximum

      action:
        - action: weather.get_forecasts
          continue_on_error: true
          data:
            type: daily
          target:
            entity_id: weather.freudenstadt
          response_variable: forecast_data

      sensor:
        - name: "Forecast Weather Max Temp today"
          unique_id: forecast_weather_max_temp_today
          # Tageshöchstwert für den heutigen Kalendertag (0-24 Uhr):
          # das Größere aus aktueller DWD-Prognose und bisher gemessenem
          # Tagesmaximum (sensor.aussentemp_tagesmaximum).
          #
          # Die Prognose wird jedes Mal frisch übernommen, damit DWD-Korrekturen
          # nach unten auch ankommen (früher: laufendes Maximum aller Abrufe,
          # das veraltete Prognosewerte festhielt). Der Prognose-Eintrag wird
          # per Datum gewählt, nicht per Index [0].
          #
          # simple_dwd_weatherforecast liefert für "heute" nur die Stunden ab
          # dem Abruf. Bereits vergangene Extremwerte deckt der Messwert ab.
          # Fällt die Prognose aus, bleibt der bisherige Wert als Ersatz.
          state: >
            {% set fc = (forecast_data | default({})).get('weather.freudenstadt', {}).get('forecast', []) %}
            {% set heute = fc | selectattr('datetime','defined')
                 | selectattr('datetime','search', now().strftime('%Y-%m-%d')) | list %}
            {% set prog = (heute[0].temperature if heute else none) | float(None) %}
            {% if prog is none and this.last_changed is defined
                  and (this.last_changed | as_local).date() == now().date() %}
              {% set prog = this.state | float(None) %}
            {% endif %}
            {% set mess = states('sensor.aussentemp_tagesmaximum') | float(None)
                 if state_attr('sensor.aussentemp_tagesmaximum', 'datum') == now().date() | string else none %}
            {% set werte = [prog, mess] | reject('none') | list %}
            {{ werte | max if werte else none }}
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Forecast Weather Min Temp today"
          unique_id: forecast_weather_min_temp_today
          # Tagestiefstwert für den heutigen Kalendertag (0-24 Uhr):
          # das Kleinere aus aktueller DWD-Prognose und bisher gemessenem
          # Tagesminimum (sensor.aussentemp_tagesminimum). Sonst wie Max-Sensor.
          state: >
            {% set fc = (forecast_data | default({})).get('weather.freudenstadt', {}).get('forecast', []) %}
            {% set heute = fc | selectattr('datetime','defined')
                 | selectattr('datetime','search', now().strftime('%Y-%m-%d')) | list %}
            {% set prog = (heute[0].templow if heute else none) | float(None) %}
            {% if prog is none and this.last_changed is defined
                  and (this.last_changed | as_local).date() == now().date() %}
              {% set prog = this.state | float(None) %}
            {% endif %}
            {% set mess = states('sensor.aussentemp_tagesminimum') | float(None)
                 if state_attr('sensor.aussentemp_tagesminimum', 'datum') == now().date() | string else none %}
            {% set werte = [prog, mess] | reject('none') | list %}
            {{ werte | min if werte else none }}
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Forecast Weather Wind today"
          unique_id: forecast_weather_wind_today
          availability: >
            {{ forecast_data is defined
              and forecast_data['weather.freudenstadt'] is defined
              and (forecast_data['weather.freudenstadt'].forecast | length) > 0
              and (forecast_data['weather.freudenstadt'].forecast[0].wind_speed is defined) }}
          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[0].wind_speed
              | float(default=unknown) }}
          unit_of_measurement: "m/s"
          device_class: wind_speed
          state_class: measurement

        - name: "Forecast Weather Regen today"
          unique_id: forecast_weather_regen_today
          availability: >
            {{ forecast_data is defined
              and forecast_data['weather.freudenstadt'] is defined
              and (forecast_data['weather.freudenstadt'].forecast | length) > 0
              and (forecast_data['weather.freudenstadt'].forecast[0].precipitation is defined) }}
          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[0].precipitation
              | float(default=unknown) }}
          unit_of_measurement: "mm"
          state_class: measurement

    # ---------------------- E-INK DIELE: THEME ----------------------
    # Steuert die Farben des E-Ink-Displays im Hausgang (esp-eink-eg-diele).
    #   dunkel - Aussenhelligkeit unter der Schwelle: nur Schwarz auf Weiss
    #   hell   - ueber Schwelle + Hysterese: Schwarz auf Weiss, Rot als Akzent
    #   morgen - wie hell, 06-09 Uhr zusaetzlich roter Kopfbalken
    # Zwischen den Grenzen bleibt der bisherige Zustand (Hysterese), damit
    # das Display bei Wolken nicht staendig neu zeichnet (~15 s Flackern).
    # Das ESP zeichnet bei jedem Wechsel sofort neu.
    - trigger:
        - trigger: state
          entity_id:
            - sensor.wetterluxtotal
            - input_number.eink_diele_schwelle_lux
            - input_number.eink_diele_hysterese_lux
        - trigger: time
          at:
            - "06:00:00"
            - "09:00:00"
        - trigger: homeassistant
          event: start
      sensor:
        - name: "eInk Diele Theme"
          unique_id: eink_diele_theme
          default_entity_id: sensor.eink_diele_theme
          icon: mdi:palette
          state: >
            {% set lux = states('sensor.wetterluxtotal') | float(0) %}
            {% set schwelle = states('input_number.eink_diele_schwelle_lux') | float(1000) %}
            {% set hyst = states('input_number.eink_diele_hysterese_lux') | float(500) %}
            {% set war_hell = this.state in ['hell', 'morgen'] %}
            {% if lux > schwelle + hyst %}{% set hell = true %}
            {% elif lux < schwelle %}{% set hell = false %}
            {% else %}{% set hell = war_hell %}{% endif %}
            {% if not hell %}dunkel
            {% elif 6 <= now().hour < 9 %}morgen
            {% else %}hell{% endif %}

    # ---------------------- DATE & MONTH CONVERSION ----------------------
    - sensor:
        - default_entity_id: sensor.weekday_german
          state: >-
            {% set wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"] %}
            {{ wochentage[now().weekday()] }}
          name: weekday_german
          unique_id: "weekday_german"
    - sensor:
        - default_entity_id: sensor.date_german
          state: >-
            {% set monat = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"] %}
            {% set monat = monat[now().month - 1] %}
            {{ now().day }}. {{ monat }} {{now().year}}
          name: date_german
          unique_id: "date_german"

  # =======================================================================
  # E-INK DIELE: Helfer und Automation
  # =======================================================================
  input_number:
    eink_diele_schwelle_lux:
      name: "eInk Diele Schwelle (Lux außen)"
      icon: mdi:brightness-5
      min: 100
      max: 20000
      step: 100
      unit_of_measurement: lx
      mode: box
    eink_diele_hysterese_lux:
      name: "eInk Diele Hysterese (Lux)"
      icon: mdi:arrow-expand-vertical
      min: 0
      max: 5000
      step: 100
      unit_of_measurement: lx
      mode: box

  automation:
    - id: eink_diele_refresh_erstes_ganglicht
      alias: eInk Diele - Refresh beim ersten Ganglicht am Morgen
      description: >-
        Zeichnet das Display neu, wenn morgens zum ersten Mal ein Licht im
        Hausgang EG, Hausgang OG oder im Treppenhaus (OG/EG) angeht - dann
        sind die Werte aktuell, wenn jemand davorsteht. Hoechstens einmal pro Tag.
      triggers:
        - trigger: state
          entity_id:
            - light.mb_hausgang       # Hausgang EG
            - light.mb_og_diele       # Hausgang OG
            - light.mb_og_treppenhaus # Treppenhaus OG/EG
          from: "off"
          to: "on"
      conditions:
        - condition: time
          after: "05:00:00"
          before: "10:00:00"
        - condition: template
          value_template: >
            {% set lt = state_attr(this.entity_id, 'last_triggered') %}
            {{ lt is none or (lt | as_local).date() < now().date() }}
      actions:
        - action: button.press
          target:
            entity_id: button.esp_eink_eg_diele_eink_eg_diele_refresh_screen
      mode: single
