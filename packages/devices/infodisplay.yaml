          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[8].temperature
              | float(default=unknown) }}
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Forecast (8h) Condition"
