# =============================================================================
# AGENT-BRIEFING  (fuer KI-Agents, die diese Heiz-/Kuehllogik aendern)
# =============================================================================
# Lies diesen Block, BEVOR du unten etwas aenderst. Er haelt fest, warum die
# Logik so aussieht, wie sie aussieht. Die Begruendungen stammen aus Messungen
# an der echten Anlage, nicht aus Annahmen - die Zahlen stehen dabei.
#
# UMGANG MIT DIESEN VORGABEN
#   Der Benutzer darf jede Entscheidung hier revidieren; sie sind Stand des
#   Wissens, kein Gesetz. Aber: Wenn eine neue Anweisung einer der unten
#   festgehaltenen Entscheidungen widerspricht, weise den Benutzer darauf hin,
#   nenne die betroffene Nummer und ihre Begruendung, und lass ihn entscheiden.
#   Setze die Aenderung dann um und aktualisiere diesen Block mit.
#
# WO DIE LOGIK LIEGT
#   Diese Datei    Helfer, abgeleitete Sensoren, binary_sensor.heizsaison,
#                  die neun climate-Entities.
#   automations.yaml  "WGT - Sommersteuerung" - die eigentliche
#                  Zielmodus-Bestimmung. Ohne sie ist alles hier tot.
#   scripts.yaml   wgt_mode_2 - schreibt die Modbus-Register je Modus.
#   packages/bus/wgt.yaml  Hub und Register (bewusst getrennt).
#   blueprints/.../beschattung_fenster.yaml  liest ueber indoor_target_sensor
#                  DIESELBE Komfort-Obergrenze. Siehe (1).
#
# -----------------------------------------------------------------------------
# GRUNDIDEE
#   HA besitzt die BETRIEBSART der WGT (heat / cool / fan_only / off), nicht die
#   Raumregelung. Die Zieltemperatur je Raum haelt die WGT selbst ein; HA
#   entscheidet nur, in welchem Betriebszustand sie das tun darf.
#   Daraus folgt: HA ist KEIN zweiter Thermostat. Wer hier eine Raumregelung
#   nachbaut, kaempft gegen den Regler im Geraet.
#
# -----------------------------------------------------------------------------
# ENTSCHEIDUNGEN
#
# (1) EINE SCHWELLE FUER KUEHLUNG UND BESCHATTUNG. NICHT ENTKOPPELN.
#     sensor.komfort_obergrenze_<raum> = WGT-Zieltemperatur + Offset. Sie wird
#     von der Sommersteuerung (ueber wgt_max_ueberschreitung) UND von der
#     Beschattung (ueber indoor_target_sensor) gelesen.
#     Grund: am 23.08.2026 kuehlte die Waermepumpe ein 21,6 C warmes Haus,
#     waehrend die Beschattung die Jalousien offen liess, damit die Sonne
#     heizt. Zwei Regelkreise mit getrennten Meinungen ueber denselben Raum.
#     Wenn du hier etwas aenderst, pruefe IMMER die Beschattung mit.
#
# (2) DIE WGT-ZIELTEMPERATUREN SIND HEIZ-SOLLWERTE, KEINE OBERGRENZEN.
#     Stand 08/2026: 20 C ueberall, Linus-Henry 18 C. Direkt als Kuehlschwelle
#     genommen laeuft die Anlage praktisch permanent - alle acht Raeume lagen
#     zum Messzeitpunkt darueber. Erst Soll + Offset ergibt eine Obergrenze.
#     Der Offset 4 K reproduziert exakt die 24 C, die vorher in allen fuenf
#     Beschattungs-Automationen von Hand standen.
#     Die Sollwerte sind NICHT statisch, nur selten verstellt (Wohnzimmer seit
#     07/2024 auf 20 C, einmal drei Tage auf 19 C). Deshalb lohnt die Ableitung.
#
# (3) VERGLICHEN WIRD JE RAUM GEGEN DIE EIGENE GRENZE, DANN DAS MAXIMUM.
#     NICHT "niedrigste Zieltemperatur aller Raeume". Das wuerde die Temperatur
#     des einen Raums mit dem Sollwert eines anderen vergleichen und
#     Linus-Henry (Soll 18 C) zum Diktator ueber die zentrale Kuehlung machen.
#
# (4) KUEHLSEITE FUENF RAEUME, HEIZSEITE ACHT.
#     wgt_max_ueberschreitung: Wohnzimmer, Buero, Schlafzimmer, Erik,
#     Linus-Henry. Diele, WC EG und Bad OG heizen sich anders auf und sollen
#     die zentrale Kuehlung nicht ausloesen.
#     ACHTUNG: sensor.komfort_obergrenze_* gibt es seit 26.08.2026 fuer ALLE
#     ACHT Raeume - als ablesbare Schwelle je Raum und fuer raumbezogene
#     Automationen. Die Kuehl-Beschraenkung haengt allein an der Raumliste in
#     wgt_max_ueberschreitung, nicht daran, welche Sensoren es gibt. Einen
#     Raum dort zu ergaenzen, nur weil sein Sensor existiert, hebt diese
#     Entscheidung auf - vorher nachfragen.
#     wgt_max_unterschreitung: alle acht. Beim Schutz vor Auskuehlen soll das
#     Bad sehr wohl mitreden.
#
# (5) ABSOLUTE UNTERGRENZE 22 C IN DER KOMFORT-OBERGRENZE.
#     Schuetzt gegen einen versehentlich zu kleinen Offset und gegen den
#     Erstlauf, bei dem der input_number auf seinem Minimum steht. Bei Offset
#     4 K bindet sie nur bei Linus-Henry (18 + 4 = 22).
#
# (6) PV-UEBERSCHUSS IST DIE ERLAUBNIS ZU KUEHLEN, NICHT DER GRUND.
#     Frueher fragte der cool-Zweig ausschliesslich nach PV-Ueberschuss und
#     hatte gar keine Temperaturbedingung - das war die Ursache von (1).
#     kuehl_bedarf muss zusaetzlich erfuellt sein. Nicht zurueckbauen.
#
# (7) DIE SAISON KOMMT AUS EINEM 7-TAGE-MITTEL. NICHT VERKUERZEN.
#     Gemessen ueber 03/2025-08/2026: mit 48-h-Mittel schaltet die Saison bei
#     denselben Grenzen 16-mal in 1,3 Jahren um, davon SECHSMAL mitten in den
#     Sommer - sommerliche Kaltlufteinbrueche ziehen das kurze Mittel unter die
#     Heizgrenze. Ab 168 h liefert JEDES getestete Deadband 3 Umschaltungen und
#     keine Fehlschaltung. Diese Unempfindlichkeit gegen die Schwellenwahl ist
#     der eigentliche Grund fuer die Fensterlaenge, nicht die Traegheit.
#
# (8) DIE MITTELWERTKETTE IST ZWEISTUFIG. NICHT DIREKT VERDRAHTEN.
#     sensor.temp_aussen_low aendert sich 3001-mal pro Tag (gemessen). Ein
#     statistics-Sensor mit max_age 7 Tage muesste rund 21.000 Samples puffern.
#     Der time_throttle davor laesst einen Wert pro Stunde durch -> 168 Samples.
#
# (9) EIGENE SAISON-GRENZEN, NICHT input_number.heizgrenze / kuehlgrenze.
#     Die beiden sind fuer die Gradtag-Abrechnung getunt (packages/env/
#     degreedays.yaml, aus der Regression Jan-Aug 2026). Wer sie dort nachzieht,
#     soll nicht ungewollt die Saison verschieben.
#     Der Stellbereich der Saison-Heizgrenze (-5 bis 20 C) spannt bewusst den
#     Bereich, den das 7-Tage-Mittel real durchlaeuft: gemessen -6,4 bis
#     +26,7 C, Median 11,1 C.
#
# (10) OHNE VORZUSTAND WIRD AUS DEN DATEN ENTSCHIEDEN, NICHT GERATEN.
#     binary_sensor.heizsaison haelt bei duenner Pufferabdeckung (< 0,15) den
#     alten Zustand - aber nur, wenn es einen gibt.
#     Grund: am 24.08.2026 wurde der Sensor neu angelegt, sah 'unknown', wertete
#     das ueber 'this.state != off' als Heizsaison und liess die Anlage zwei
#     Tage lang im August heizen.
#     WICHTIG fuer kuenftige Aenderungen: welcher Default sicher ist, hat sich
#     mit dem Umbau auf ganzjaehrige Steuerung GEDREHT. Solange heizsaison=on
#     nur bedeutete "Automation ruehrt nichts an", war 'on' vorsichtig. Seit die
#     Automation daraufhin aktiv heat schreibt, ist 'off' die vorsichtige Wahl -
#     eine zu frueh gesetzte Sommer-Entscheidung faengt (11) ab, eine zu lange
#     gehaltene Heizsaison faengt niemand ab.
#
# (11) HEIZBEDARF IST EIN ECHTER ZWEIG, KEIN VETO.
#     Frueher hielt er nur den Ist-Modus fest. Stand der schon auf off, kuehlte
#     das Haus aus und die Automatik sah zu. Jetzt wird geheizt, unabhaengig
#     von der Saison.
#     Schwelle 1,5 K, Hysterese bis 0,5 K. BEIDE Schwellen liegen bewusst neben
#     dem Punkt, an dem die WGT die Raeume parkt - das war ein Fehler in der
#     ersten Fassung (1,0 / 0,0). Weil max() ueber acht Raeume fast immer >= 0
#     ist, war die Loslass-Bedingung im Mai nur an 22 % der Stunden erfuellt und
#     an 21 % sogar im Juli. Da der Heizzweig ZUERST geprueft wird, sperrte ein
#     eingerastetes heat die Kuehlung fuers ganze Haus, und der Saisonwechsel
#     auf Sommer lief ins Leere.
#     Gemessene Anteile der Stunden mit max(Soll - Ist) >= Schwelle:
#       >= 1,5 K (Start)  Jul 0,1 % | Aug 0,0 % | Nov 38 %  -> im Sommer still,
#                         als Sicherheitsnetz im Winter trotzdem scharf
#       >= 0,5 K (Ende)   Jul 7,9 % | Aug 9,1 %  -> laesst zuverlaessig los
#     NICHT auf 0,0 zurueckdrehen.
#     Dieser Zweig ist das Sicherheitsnetz unter (7) und (10). Nicht entfernen.
#
# (12) BEIDE KUEHLZWEIGE HAENGEN AM KUEHLBEDARF - AUCH fan_only.
#     Die freie Kuehlung fragte urspruenglich nur "draussen kuehler als
#     drinnen". Solange die Automation nur im Sommer lief, war das harmlos.
#     Ganzjaehrig haette sie nach dem Ende einer Heizphase bei 6 C aussen
#     Kaltluft ins Haus geblasen.
#
# (13) DER RUHEZUSTAND IST NICHT PAUSCHAL off.
#     Komplett abgeschaltet (Betriebsart 0) wird nur, wenn der VORHERGESAGTE
#     Tageshoechstwert ueber wgt_lueftung_aus_ab liegt - dann holt schon blosses
#     Lueften Warmluft ins Haus, und genau das will der Benutzer verhindern.
#     Sonst fan_only, damit der Luftwechsel an milden Tagen weiterlaeuft.
#     Bewusst die Vorhersage und nicht die aktuelle Aussentemperatur: sonst
#     liefe die Anlage den halben Vormittag, um mittags doch abzuschalten.
#     In der Heizsaison ist das unerreichbar - (11) kommt vorher.
#
# (14) HANDBETRIEB WIRD UEBER SOLL-IST ERKANNT, NICHT UEBER last_changed.
#     input_text.wgt_automatik_soll haelt fest, was die Automation zuletzt
#     selbst geschrieben hat. Weicht climate.wgtmode_template davon ab, war es
#     das Bedienteil oder die UI -> Nachlauf, kein Ueberschreiben.
#     Grund: ein Modbus-Aussetzer (30.07.2026, 55 s) setzt last_changed zurueck
#     und saehe wie eine Handbedienung aus. Aus demselben Grund ist auch
#     wgt_kuehlung_start ein input_datetime und nicht last_changed.
#
# (18) DIE PV-EINSCHALTSCHWELLE MUSS UEBER DER LAST LIEGEN, NICHT AUF IHR.
#     Gemessen an der Kuehlphase vom 19.08.2026 (405 min), Grundlast des Zaehlers
#     (1.7 kWh/Tag) abgezogen: die WP zieht beim Kuehlen 601 W.
#     Frueher stand die Einschaltschwelle auf 600 W - also genau auf der Last. Der
#     Ueberschuss war damit in dem Moment aufgebraucht, in dem die Pumpe anlief,
#     die Weiterlauf-Schwelle von 150 W sofort verletzt, und nur die
#     Mindestlaufzeit hielt die Kuehlung noch. Signatur in den Daten: 9 von 14
#     Kuehlphasen dauerten exakt 30 Minuten (20 min Mindestlaufzeit im
#     15-Minuten-Raster).
#     Jetzt 1000 W = Last 601 + Weiterlauf 150 + Reserve. Wer die Schwelle senkt,
#     baut das Takten wieder ein. Die 150 W bleiben, sie sind richtig definiert:
#     "speist trotz laufender Pumpe noch 150 W ein".
#
# (19) DIE SAISON HAENGT AN recorder.purge_keep_days.
#     sensor.aussentemp_mittel_7d fuellt seinen Puffer nach einem Neustart aus dem
#     Recorder auf. Das funktioniert nur, solange dort mehr als 7 Tage Historie von
#     sensor.aussentemp_gedrosselt liegen. purge_keep_days steht auf dem HA-Default
#     von 10 - faellt der Wert unter 8, bleibt der Puffer nach jedem Neustart unter
#     der Abdeckungsschwelle und die Saison-Erkennung haengt tagelang fest (siehe
#     den Vorfall in (10)). Wer in packages/system/recorder.yaml aufraeumt: hier
#     nachsehen.
#
# (17) IM URLAUB WIRD NICHT GEKUEHLT, ABER GELUEFTET.
#     Sowohl der WP-Zweig als auch die Mindestlaufzeit pruefen urlaubsmodus.
#     fan_only und die freie Kuehlung laufen dagegen normal weiter - so vom
#     Benutzer gewuenscht. Die Handbetriebs-Erkennung ist im Urlaub NICHT
#     abgeschaltet (war sie frueher, siehe (A)).
#
# (15) ES GIBT KEINEN SAISON-SCHALTER MEHR.
#     input_boolean.sommersteuerung_luftung ist entfallen. Er war kein
#     Saison-Schalter, sondern ein Uebergriffsschutz: die Automation konnte nur
#     off/fan_only/cool schreiben und haette im Winter das von Hand gesetzte
#     heat ueberschrieben. Mit (10) und (11) ist er ueberfluessig.
#     Nicht als "Automatik aus"-Boolean wieder einfuehren, ohne den Benutzer zu
#     fragen - (14) ist der vorgesehene Ausweg.
#
# (16) DIE WGT NIMMT FREIGABEN NUR IN PASSENDER BETRIEBSART AN.
#     Verifiziert am 30.07.2026. Deshalb schreibt wgt_mode_2 erst Register 100,
#     wartet auf die Rueckmeldung und gibt erst dann frei (231/232). Beim
#     Abschalten umgekehrt. Reihenfolge dort nicht umstellen.
#
# -----------------------------------------------------------------------------
# BEKANNTE LUECKEN (offen, bewusst nicht geloest)
#
# (A) EIN FEHLGESCHLAGENER MODBUS-SCHREIBVORGANG IST VON EINER HANDBEDIENUNG
#     NICHT UNTERSCHEIDBAR. Beides zeigt sich als Abweichung zwischen
#     wgt_automatik_soll und dem Ist-Modus und loest den Nachlauf aus (14).
#     Aus demselben Grund muss JEDE andere Automation, die den Modus schreibt,
#     wgt_automatik_soll mitsetzen - "Urlaub - Geraetesteuerung WGT" tut das.
#     Wer eine weitere hinzufuegt und das vergisst, legt die Automatik lahm.
#     Die Automatik ruht dann, ohne dass jemand etwas getan hat. Deshalb steht
#     input_datetime.wgt_handbetrieb_bis sichtbar auf dem Dashboard
#     (System -> Lueftung) und nicht im Verborgenen.
#
# (B) UNGEPRUEFT: OB DIE WGT BEI BETRIEBSART 0 NOCH GRUNDLUEFTUNG FAEHRT.
#     Der Benutzer schaltet an heissen Tagen bewusst komplett ab und ist damit
#     zufrieden, siehe (13). Ob dabei jeder Luftwechsel steht oder eine
#     Grundstufe weiterlaeuft, ist aus der Konfiguration nicht ableitbar und
#     wurde nicht am Geraet nachgesehen. Falls sich herausstellt, dass gar nicht
#     mehr gelueftet wird: fan_only als Ruhezustand statt off, oder eine
#     Mindest-Aussentemperatur statt des Kuehlbedarfs in (12).
#
# (C) input_number-HELFER STARTEN AUF IHREM MINIMUM.
#     Nach einer Neuanlage stehen wgt_komfort_offset, beide Saison-Grenzen,
#     wgt_lueftung_aus_ab und wgt_handbetrieb_dauer auf dem jeweiligen min und
#     muessen von Hand gesetzt werden. 'initial:' waere die naheliegende
#     Loesung, ueberschreibt aber bei JEDEM Neustart eine manuelle Aenderung -
#     deshalb nicht verwendet. Die Minima sind stattdessen so gewaehlt, dass der
#     Erstlauf-Zustand nichts kaputt macht; (5) und der Guard in heizsaison
#     fangen den Rest ab.
#
# (D) t_innen IN DER fan_only-BEDINGUNG IST NUR DAS WOHNZIMMER.
#     Kuehl- und Heizbedarf gehen ueber fuenf bzw. acht Raeume, der Vergleich
#     "draussen kuehler als drinnen" aber weiterhin ueber
#     sensor.temperatur_wohnzimmer allein. Inkonsistent. Sauber waere der
#     waermste der fuenf Kuehl-Raeume. Vom Benutzer nicht beauftragt.
# =============================================================================
package_building_hvac:
  # -------------------------------------------------------------------
  # Package: Heizung, Kuehlung, Lueftung (Schwoerer WGT)
  #
  # Logikebene der WGT: Helfer, abgeleitete Sensoren, Templates und die
  # neun climate-Entities. Die MODBUS-Anbindung samt aller Register liegt
  # bewusst getrennt in packages/bus/wgt.yaml.
  #
  # Grund fuer die Trennung: Hub und Register muessen zwingend in EINER
  # Datei bleiben (Packages fuehren modbus: als Liste zusammen, zwei Hubs
  # gleichen Namens waeren ein Konflikt). Alles darueber greift dagegen
  # nur ueber entity_id zu und ist damit frei verschiebbar.
  #
  # Raumnummern der WGT: 1 Diele EG, 2 Essen/Wohnen, 3 Buero, 4 Schlafen,
  # 5 Linus, 6 Erik, 7 WC/DU EG, 8 Bad OG
  # -------------------------------------------------------------------
  ################################################################################################
  #
  # 1a) HELFER
  #
  # Startzeitpunkt der WP-Kühlung. Wird von "WGT - Sommersteuerung" gesetzt, sobald
  # auf cool geschaltet wird, und dient dort der Mindestlaufzeit des Verdichters.
  # Bewusst NICHT über climate.wgtmode_template.last_changed gelöst: ein
  # Modbus-Aussetzer (am 30.07.2026 um 13:25 für 55 s) setzt last_changed zurück
  # und hätte der Kühlung dadurch 20 frische Minuten geschenkt.
  ################################################################################################
  input_datetime:
    wgt_kuehlung_start:
      name: "WGT Kühlung Start"
      has_date: true
      has_time: true
      icon: mdi:snowflake-check
    wgt_handbetrieb_bis:
      name: "WGT Handbetrieb bis"
      has_date: true
      has_time: true
      icon: mdi:hand-back-right-off-outline

  ################################################################################################
  #
  # 1c) KOMFORT-OFFSET
  #
  # Aufschlag auf die WGT-Zieltemperatur je Raum. Die Zielwerte sind
  # HEIZ-Sollwerte (Stand 08/2026: 20 C, Linus-Henry 18 C) - direkt als
  # Kuehlschwelle genommen wuerde die Anlage praktisch permanent laufen.
  # Erst Soll + Offset ergibt die Komfort-OBERgrenze.
  #
  # 4 K reproduziert exakt die 24 C, die vorher in allen fuenf
  # Beschattungs-Automationen von Hand standen.
  ################################################################################################
  input_number:
    wgt_komfort_offset:
      name: "Komfort-Offset über Zieltemperatur"
      min: 0
      max: 8
      step: 0.5
      unit_of_measurement: "K"
      icon: mdi:thermometer-plus

    # Eigene Saison-Grenzen, absichtlich NICHT input_number.heizgrenze /
    # kuehlgrenze mitbenutzt: die beiden sind fuer die Gradtag-Abrechnung
    # getunt (13 / 18 C aus der Regression Jan-Aug 2026). Wer sie dort mal
    # nachzieht, wuerde sonst ungewollt die Saison verschieben.
    #
    # Empfohlen 13 / 18 C.
    #
    # Die Grenzen spannen den Bereich, den das 7-Tage-Mittel hier real
    # durchlaeuft (gemessen 03/2025-08/2026, n=11092 Stundenwerte):
    #   Minimum -6.4 C | 1. Perz. -5.1 | 25. Perz. 5.2 | Median 11.1
    #   75. Perz. 17.0 | 90. Perz. 21.4 | Maximum 26.7 C
    # Eine Heizgrenze unter rund 2 C ist praktisch nicht sinnvoll - die
    # Heizsaison begaenne dann erst nach einer Frostwoche. Einstellbar ist
    # sie trotzdem, die Grenzen sind Leitplanken, keine Empfehlung.
    #
    # Erstlauf: beide starten auf ihrem Minimum, also -5 / 10. Der Guard im
    # binary_sensor haelt die Heizgrenze immer mindestens 1 K unter der
    # Kuehlgrenze, das Deadband ist damit gueltig. Beim aktuellen Mittel von
    # 17.7 C ergibt das Sommerbetrieb - die richtige Seite.
    wgt_saison_heizgrenze:
      name: "Saison Heizgrenze"
      min: -5
      max: 20
      step: 0.5
      unit_of_measurement: "°C"
      icon: mdi:snowflake-thermometer

    wgt_saison_kuehlgrenze:
      name: "Saison Kühlgrenze"
      min: 10
      max: 25
      step: 0.5
      unit_of_measurement: "°C"
      icon: mdi:sun-thermometer

    # Ab welchem VORHERGESAGTEN Tageshoechstwert die Anlage im Sommer
    # komplett abgeschaltet wird (Betriebsart 0), statt nur zu lueften.
    #
    # Hintergrund: an heissen Tagen holt schon die blosse Lueftung Warmluft
    # ins Haus - deshalb wird dann ganz abgeschaltet, und das funktioniert
    # in der Praxis gut. An milden Tagen ist dasselbe Abschalten aber
    # unnoetig und kostet Luftwechsel. Der Schwellwert trennt beides.
    #
    # Greift nur im Sommerbetrieb: in der Heizsaison und bei Heizbedarf
    # laeuft die Anlage ohnehin auf heat und wird nie abgeschaltet.
    wgt_lueftung_aus_ab:
      name: "Lüftung aus ab Tageshöchstwert"
      min: 20
      max: 40
      step: 0.5
      unit_of_measurement: "°C"
      icon: mdi:fan-off

    # Wie lange die Automatik nach einer Bedienung am Handteil ruht.
    wgt_handbetrieb_dauer:
      name: "Handbetrieb Nachlaufzeit"
      min: 1
      max: 24
      step: 1
      unit_of_measurement: "h"
      icon: mdi:hand-back-right-outline

  ################################################################################################
  #
  # 1d) HANDBETRIEB-ERKENNUNG
  #
  # Die Automation merkt sich hier, welchen Modus sie zuletzt selbst
  # geschrieben hat. Weicht climate.wgtmode_template davon ab, hat jemand
  # am Bedienteil oder in der UI eingegriffen -> Automatik ruht bis
  # wgt_handbetrieb_bis.
  #
  # Bewusst NICHT ueber climate.wgtmode_template.last_changed: ein
  # Modbus-Aussetzer setzt last_changed zurueck und saehe wie eine
  # Handbedienung aus. Siehe denselben Grund bei wgt_kuehlung_start.
  ################################################################################################
  input_text:
    wgt_automatik_soll:
      name: "WGT zuletzt von der Automatik geschrieben"
      max: 20
      icon: mdi:robot-outline


  ################################################################################################
  #
  # 1b) GEMITTELTER NETZÜBERSCHUSS
  #
  # sensor.mb_solaredge_m1_ac_power_final ist der Momentanwert des Zählers (Meter 1).
  # Der schwankt sekündlich um mehrere kW und ist als Schaltkriterium unbrauchbar.
  # Für die Sommersteuerung wird deshalb der 15-Minuten-Mittelwert verwendet.
  ################################################################################################
  sensor:
    - platform: statistics
      name: "PV Ueberschuss Mittel 15min"
      unique_id: "pv_ueberschuss_mittel_15min"
      entity_id: sensor.mb_solaredge_m1_ac_power_final
      state_characteristic: mean
      sampling_size: 250
      max_age:
        minutes: 15
      precision: 0

  ################################################################################################
  #
  # 1f) GLEITENDES AUSSENTEMPERATUR-MITTEL (Saison-Erkennung)
  #
  # Zweistufig, und zwar aus einem gemessenen Grund: sensor.temp_aussen_low
  # aendert sich 3001-mal pro Tag. Ein statistics-Sensor mit max_age 7 Tage
  # muesste dafuer rund 21.000 Samples puffern. Der time_throttle davor
  # laesst nur einen Wert pro Stunde durch -> 168 Samples.
  #
  # Warum 7 Tage: mit 48-h-Mittel schaltet die Saison bei denselben Grenzen
  # 16-mal in 1.3 Jahren um, davon 6-mal mitten in den Sommer (sommerliche
  # Kaltlufteinbrueche ziehen das kurze Mittel unter die Heizgrenze). Ab
  # 168 h liefert JEDES getestete Deadband 3 Umschaltungen und keine
  # Sommer-Fehlschaltung - das Ergebnis haengt dann nicht mehr an der
  # exakten Schwelle, und genau das ist der Grund fuer diese Fensterlaenge.
  ################################################################################################
    - platform: filter
      name: "Aussentemp gedrosselt"
      unique_id: "aussentemp_gedrosselt"
      entity_id: sensor.temp_aussen_low
      filters:
        - filter: time_throttle
          window_size: "01:00:00"

    - platform: statistics
      name: "Aussentemp Mittel 7d"
      unique_id: "aussentemp_mittel_7d"
      entity_id: sensor.aussentemp_gedrosselt
      state_characteristic: mean
      sampling_size: 200
      max_age:
        days: 7
      precision: 1

  ################################################################################################
  #
  # 2) TEMPLATE-SENSOREN
  #
  ################################################################################################
  template:
    - sensor:
        # -------------------------------------------------------------------
        # Zusatzheizungen (0/1 -> Aus/Aktiv)
        # -------------------------------------------------------------------
        - name: "Wohnz."
          unique_id: "zusatzheizung_aktiv_wohnzimmer_text"
          state: >-
            {% set raw = states('sensor.zusatzheizung_aktiv_wohnzimmer') %}
            {% if is_number(raw) %}
              {{ {0:'Aus',1:'Aktiv'}[raw|int] if (raw|int) in [0,1] else 'Unknown' }}
            {% else %}Unknown{% endif %}
          icon: >-
            {% set v = states('sensor.zusatzheizung_aktiv_wohnzimmer')|int(-1) %}
            {{ 'mdi:radiator-off' if v==0 else 'mdi:radiator' if v==1 else 'mdi:help' }}
          availability: "{{ is_number(states('sensor.zusatzheizung_aktiv_wohnzimmer')) }}"

