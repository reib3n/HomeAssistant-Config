        - name: "WGT Wärmepumpe total"
          unique_id: "wgt_heatpump_total"
          state: "{{ states('sensor.status_waermepumpe_wgt_text') }}"
          attributes:
            Lufttemperatur: >-
              {% set v = states('sensor.temperatur_nach_ne') %}
              {% if is_number(v) %}{{ v ~ '°C' }}{% else %}-{% endif %}


        # -------------------------------------------------------------------
        # KOMFORT-OBERGRENZE JE RAUM
        #
        # Eine Schwelle, zwei Verbraucher: die Sommersteuerung (ueber
        # sensor.wgt_max_ueberschreitung) und die Beschattung (ueber
        # indoor_target_sensor im Blueprint). Solange beide dieselbe Zahl
        # lesen, koennen sie sich nicht mehr widersprechen - genau der
        # Fall vom 23.08.2026, als die WP ein 21.6-C-Haus gekuehlt hat,
        # waehrend die Beschattung es aufheizen lassen wollte.
        #
        # Absolute Untergrenze 22 C: schuetzt gegen einen versehentlich zu
        # kleinen Offset und gegen den allerersten Start, bei dem der
        # input_number noch auf dem Minimum steht. Bei Offset 4 bindet sie
        # nur bei Linus-Henry (18 + 4 = 22).
        #
        # Es gibt sie fuer ALLE ACHT Raeume. Dass Diele, WC EG und Bad OG die
        # zentrale Kuehlung nicht ausloesen duerfen, steckt NICHT darin, welche
        # Sensoren existieren, sondern allein in der Raumliste von
        # sensor.wgt_max_ueberschreitung weiter unten - siehe Briefing (4).
        # Wer hier einen Raum ergaenzt, aendert die Kuehlung also NICHT mit.
        # -------------------------------------------------------------------
        - name: "Komfort Obergrenze Wohnzimmer"
          unique_id: "komfort_obergrenze_wohnzimmer"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_wohnzimmer')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_wohnzimmer') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze Büro"
          unique_id: "komfort_obergrenze_buro"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_buro')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_buro') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze Schlafzimmer"
          unique_id: "komfort_obergrenze_schlafzimmer"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_schlafzimmer')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_schlafzimmer') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze Erik"
          unique_id: "komfort_obergrenze_erik"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_erik')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_erik') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze Linus-Henry"
          unique_id: "komfort_obergrenze_linus_henry"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_linus_henry')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_linus_henry') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        # Die folgenden drei sind bewusst NICHT Teil der Kuehl-Raumliste
        # (Briefing 4). Sie existieren, damit jeder Raum eine ablesbare
        # Komfort-Obergrenze hat und raumbezogene Automationen - etwa die
        # Beschattung Bad OG - dieselbe Schwelle lesen koennen wie die
        # Sommersteuerung, statt eine eigene Zahl zu erfinden.
        - name: "Komfort Obergrenze Bad OG"
          unique_id: "komfort_obergrenze_bad_og"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_bad_og')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_bad_og') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze Diele"
          unique_id: "komfort_obergrenze_diele"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_diele')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_diele') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        - name: "Komfort Obergrenze WC EG"
          unique_id: "komfort_obergrenze_wc_eg"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer-chevron-up
          availability: "{{ is_number(states('sensor.zieltemperatur_wc_eg')) }}"
          state: >-
            {% set soll = states('sensor.zieltemperatur_wc_eg') | float(none) %}
            {{ [ soll + states('input_number.wgt_komfort_offset') | float(4),
                 22.0 ] | max | round(1) if soll is not none else none }}

        # -------------------------------------------------------------------
        # GROESSTE UEBERSCHREITUNG UEBER ALLE RAEUME
        #
        # Bewusst NICHT "niedrigste Zieltemperatur": das wuerde die
        # Temperatur des einen Raums mit dem Sollwert eines anderen
        # vergleichen und Linus-Henry (Soll 18 C) zum Diktator ueber die
        # zentrale Kuehlung machen. Verglichen wird je Raum gegen die
        # EIGENE Obergrenze, das Maximum entscheidet.
        #
        # >= 0 bedeutet: mindestens ein Raum ist ueber seiner Obergrenze.
        # Raeume mit unlesbarem Ist- oder Sollwert fallen still heraus;
        # faellt der ganze Modbus aus, wird der Sensor unavailable und die
        # Sommersteuerung fasst nichts an (Plausibilitaets-Condition dort).
        # -------------------------------------------------------------------
        - name: "WGT Max Ueberschreitung"
          unique_id: "wgt_max_ueberschreitung"
          unit_of_measurement: "K"
          state_class: measurement
          icon: mdi:thermometer-alert
          # Kein availability-Template: laesst sich KEIN Raum lesen, liefert der
          # State none und die Entitaet wird unknown. Das spart einen dritten
          # Durchlauf derselben Raumliste; die Automation prueft ohnehin mit
          # is_number().
          state: >-
            {% set raeume = ['wohnzimmer', 'buro', 'schlafzimmer', 'erik', 'linus_henry'] %}
            {% set ns = namespace(d = none) %}
            {% for r in raeume %}
              {% set ist = states('sensor.temperatur_' ~ r) | float(none) %}
              {% set ref = states('sensor.komfort_obergrenze_' ~ r) | float(none) %}
              {% if ist is not none and ref is not none and (ns.d is none or ist - ref > ns.d) %}
                {% set ns.d = ist - ref %}
              {% endif %}
            {% endfor %}
            {{ ns.d | round(1) if ns.d is not none else none }}
          attributes:
            Raum: >-
              {% set raeume = ['wohnzimmer', 'buro', 'schlafzimmer', 'erik', 'linus_henry'] %}
              {% set ns = namespace(d = none, r = none) %}
              {% for r in raeume %}
                {% set ist = states('sensor.temperatur_' ~ r) | float(none) %}
                {% set ref = states('sensor.komfort_obergrenze_' ~ r) | float(none) %}
                {% if ist is not none and ref is not none and (ns.d is none or ist - ref > ns.d) %}
                  {% set ns.d = ist - ref %}{% set ns.r = r %}
                {% endif %}
              {% endfor %}
              {{ state_attr('sensor.temperatur_' ~ ns.r, 'friendly_name') if ns.r else '-' }}

        # -------------------------------------------------------------------
        # GROESSTE UNTERSCHREITUNG - Heizbedarf
        #
        # Spiegelbild von wgt_max_ueberschreitung, aber ueber ALLE ACHT
        # Raeume: fuer die Kuehlfreigabe sollen Diele, WC und Bad nicht
        # mitreden, beim Heizbedarf sehr wohl.
        #
        # Zweck: die Saison-Erkennung hat asymmetrische Fehlerrichtungen.
        # "Faelschlich Winter" heisst nur, dass nicht gekuehlt wird.
        # "Faelschlich Sommer" in einem Kaelteeinbruch hiesse, dass das Haus
        # auskuehlt. Deshalb heizt die Sommersteuerung bei Unterschreitung
        # unabhaengig von der Saison - der zweite Zweig neben heizsaison.
        #
        # Schwelle 1.0 K mit Hysterese bis 0.0 K, gemessen begruendet: ein
        # Raum liegt im Juli/August nur an 0.6 % der Stunden mehr als 1.0 K
        # unter Soll, bei 0.5 K waeren es 8-9 % - das wuerde im Hochsommer
        # staendig zwischen Heizen und Kuehlen umschalten. In den kritischen
        # Uebergangsmonaten ist das Signal dagegen kraeftig: Oktober 44 %,
        # November 60 %, Dezember 45 % der Stunden ueber 1.0 K.
        # -------------------------------------------------------------------
        - name: "WGT Max Unterschreitung"
          unique_id: "wgt_max_unterschreitung"
          unit_of_measurement: "K"
          state_class: measurement
          icon: mdi:thermometer-low
          # Kein availability-Template: laesst sich KEIN Raum lesen, liefert der
          # State none und die Entitaet wird unknown. Das spart einen dritten
          # Durchlauf derselben Raumliste; die Automation prueft ohnehin mit
          # is_number().
          state: >-
            {% set raeume = ['wohnzimmer', 'buro', 'schlafzimmer', 'erik', 'linus_henry', 'diele', 'wc_eg', 'bad_og'] %}
            {% set ns = namespace(d = none) %}
            {% for r in raeume %}
              {% set ist = states('sensor.temperatur_' ~ r) | float(none) %}
              {% set ref = states('sensor.zieltemperatur_' ~ r) | float(none) %}
              {% if ist is not none and ref is not none and (ns.d is none or ref - ist > ns.d) %}
                {% set ns.d = ref - ist %}
              {% endif %}
            {% endfor %}
            {{ ns.d | round(1) if ns.d is not none else none }}
          attributes:
            Raum: >-
              {% set raeume = ['wohnzimmer', 'buro', 'schlafzimmer', 'erik', 'linus_henry', 'diele', 'wc_eg', 'bad_og'] %}
              {% set ns = namespace(d = none, r = none) %}
              {% for r in raeume %}
                {% set ist = states('sensor.temperatur_' ~ r) | float(none) %}
                {% set ref = states('sensor.zieltemperatur_' ~ r) | float(none) %}
                {% if ist is not none and ref is not none and (ns.d is none or ref - ist > ns.d) %}
                  {% set ns.d = ref - ist %}{% set ns.r = r %}
                {% endif %}
              {% endfor %}
              {{ state_attr('sensor.temperatur_' ~ ns.r, 'friendly_name') if ns.r else '-' }}

    - binary_sensor:
        # -------------------------------------------------------------------
        # HEIZSAISON
        #
        # Ersetzt den fruehen input_boolean.sommersteuerung_luftung. Der war
        # kein Saison-Schalter, sondern ein Uebergriffsschutz: die
        # Sommersteuerung kann nur off/fan_only/cool schreiben, nie heat -
        # also musste im Winter von Hand verhindert werden, dass sie das
        # manuell gesetzte heat ueberschreibt. Jetzt entscheidet sie selbst.
        #
        # Deadband mit Selbsthaltung ueber 'this': unter der Heizgrenze an,
        # ueber der Kuehlgrenze aus, DAZWISCHEN bleibt der Zustand stehen.
        # Damit gibt es keinen Zitterbereich im Fruehjahr und Herbst.
        #
        # Kaltstart. Beim ALLERERSTEN Anlegen ist der statistics-Sensor leer
        # und es gibt keinen Vorzustand. Dann wird aus den vorhandenen Daten
        # entschieden, statt einen Default zu raten - genau das ist am
        # 24.08.2026 schiefgegangen: der Sensor hielt 'on' und die Anlage
        # heizte zwei Tage lang im August.
        #
        # Welcher Default sicher ist, hat sich mit dem Umbau gedreht. Solange
        # heizsaison=on nur bedeutete "Automation ruehrt nichts an", war 'on'
        # die vorsichtige Wahl. Seit die Automation daraufhin aktiv heat
        # schreibt, ist es die riskante: eine zu frueh gesetzte Sommer-
        # Entscheidung faengt heiz_bedarf ab (heizt bei wirklich kalten
        # Raeumen unabhaengig von der Saison), eine zu lange gehaltene
        # Heizsaison faengt niemand ab.
        #
        # Die 0.15 (rund 25 h) greifen deshalb nur noch, wenn es einen
        # Vorzustand zu halten gibt. Ein kuerzeres Fenster ist fuer diese
        # Anlaufphase vertretbar, weil eine Fehlentscheidung folgenlos
        # korrigiert wird - im Dauerbetrieb liegt die Abdeckung bei 1.0 und
        # die Schwelle spielt keine Rolle mehr.
        # -------------------------------------------------------------------
        - name: "Heizsaison"
          unique_id: "heizsaison"
          icon: >-
            {# 'this' statt is_state(): eine Selbstreferenz erzeugt einen Listener
               auf die eigene Entitaet und laesst das Icon einen Zyklus nachhinken. #}
            {{ 'mdi:fire' if this.state == 'on' else 'mdi:weather-sunny' }}
          state: >-
            {% set m = states('sensor.aussentemp_mittel_7d') | float(none) %}
            {% set cov = state_attr('sensor.aussentemp_mittel_7d','age_coverage_ratio') | float(0) %}
            {% set kg = states('input_number.wgt_saison_kuehlgrenze') | float(18) %}
            {# Heizgrenze immer mindestens 1 K unter der Kuehlgrenze halten,
               sonst waere das Deadband invertiert und der Sensor wuerde flattern. #}
            {% set hg = [ states('input_number.wgt_saison_heizgrenze') | float(13), kg - 1 ] | min %}
            {% set bekannt = this.state in ['on', 'off'] %}
            {% if cov < 0.15 and bekannt %}{{ this.state == 'on' }}
            {% elif m is none %}false
            {% elif m < hg %}true
            {% elif m > kg %}false
            {% else %}{{ this.state == 'on' }}{% endif %}
          attributes:
            Mittel_7d: "{{ states('sensor.aussentemp_mittel_7d') }}"
            Abdeckung: >-
              {{ (state_attr('sensor.aussentemp_mittel_7d','age_coverage_ratio')
                  | float(0) * 100) | round(0) }} %

