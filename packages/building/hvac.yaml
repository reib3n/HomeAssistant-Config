    - platform: climate_template
      name: "WGTMode_template"
      unique_id: "WGTMode_template"
      modes:
        - "heat"
        - "cool"
        - "fan_only"
        - "off"
        - "auto"
      # Rückmeldung aus dem Gerät (auch bei Bedienung am Bedienteil).
      # Register 100 (Betriebsart) kennt KEIN "Kühlen": cool und fan_only sind beide
      # Sommerbetrieb (3). Eindeutig ist erst die Kombination mit der
      # Heiz-/Kühlfunktion (230) und der WP-Kühlfreigabe (232).
      availability_template: "{{ is_number(states('sensor.betriebsart_wgt')) }}"
      hvac_mode_template: >-
        {% set ba = states('sensor.betriebsart_wgt') | int(-1) %}
        {% set kuehlt = states('sensor.wgt_heizen_kuhlen') | int(-1) == 2
                        and states('sensor.wgt_kuhlen') | int(0) == 1 %}
        {{ 'heat' if ba == 2
           else 'auto' if ba == 4
           else ('cool' if kuehlt else 'fan_only') if ba in [1, 3]
           else 'off' }}
      set_hvac_mode:
        service: script.wgt_mode_2
        data:
          modus: "{{ hvac_mode }}"
