package_system_recorder:
  # -------------------------------------------------------------------
  # Recorder-Tuning
  # Ziel: Schreiblast/DB-Größe senken, ohne für Charts/Energie relevante
  # Sensoren zu verlieren. purge_keep_days bleibt beim HA-Default (10).
  #
  # ACHTUNG bei purge_keep_days: sensor.aussentemp_mittel_7d (packages/building/
  # hvac.yaml) fuellt seinen 7-Tage-Puffer nach einem Neustart aus dem Recorder
  # auf. Unter 8 Tagen Aufbewahrung bleibt er unter der Abdeckungsschwelle, und
  # binary_sensor.heizsaison haengt nach jedem Neustart tagelang fest - die
  # Anlage heizt dann im Sommer weiter. Siehe Entscheidung (19) dort.
  # -------------------------------------------------------------------
  recorder:
    # Zustände gebündelt alle 30 s in einem Rutsch schreiben statt sofort.
    # Reduziert Disk-I/O deutlich; kein Datenverlust (nur Durability-Fenster
    # von max. 30 s bei einem harten Absturz).
    commit_interval: 30

    exclude:
      entities:
        # ==================================================================
        # AUFRAEUMEN 08/2026 - Schreiblast senken
        # 
        # Ausgangslage: 10.0 Mio. states-Zeilen bei nur 10 Tagen Aufbewahrung,
        # DB rund 2.5 GB. 73 % davon entfielen auf 45 Entities.
        # 
        # Ausgeschlossen wurde nur, was VIER Pruefungen ueberstanden hat:
        #   1. kein has_sum-Zaehler       -> Energie-Dashboard unberuehrt
        #   2. in keiner Dashboard-Karte  -> keine sichtbare Historie verloren.
        #      Nicht nur Graph-Karten pruefen: auch eine Tile-Karte zeigt im
        #      More-Info-Dialog einen Verlauf. Genau daran sind die drei
        #      Startseiten-Kacheln PV/Import/Export zunaechst durchgerutscht.
        #   3. keine Quelle eines Helfers -> kein statistics/utility_meter/
        #                                    integration haengt daran
        #   4. nicht in .storage/energy   -> faengt Faelle wie
        #      meter_1_leistung ab: ein reiner W-Sensor ohne has_sum, der
        #      trotzdem im Energie-Dashboard konfiguriert ist (Netzleistung,
        #      invertiert) und deshalb aufgezeichnet bleibt.
        # 
        # Wetterdaten bleiben vollstaendig erhalten (Vorgabe).
        # 
        # WICHTIG: Ein Ausschluss verhindert NICHT die Live-Anzeige im Dashboard
        # und stoert keine Automation - beide lesen den aktuellen State. Er
        # entfernt ausschliesslich Historie und Langzeitstatistik. Wirkt nur auf
        # NEUE Daten; die bestehende DB schrumpft erst mit dem naechsten Purge.
        # ==================================================================

        # --- UniFi-Router-Diagnose: reine Geraetetelemetrie, historisch ohne Aussage.
        - sensor.homeudm_cpu_utilization
        - sensor.homeudm_memory_utilization

        # --- System-Monitor RAM. Achtung: die _2-Variante steckt in einer Graph-Karte
#       und bleibt deshalb aufgezeichnet.
        - sensor.system_monitor_freier_speicher
        - sensor.system_monitor_speicherauslastung

        # --- SolarEdge Zaehler (Meter 1, SolarEdge-Modbus-Integration): Schein- und
#       Blindleistung, Leistungsfaktor, Spannungen und Strom. Die WIRKleistung
#       (meter_1_leistung sowie _l1/_l2/_l3) bleibt drin - sie speist Helfer,
#       und meter_1_leistung haengt invertiert im Energie-Dashboard.
        - sensor.meter_1_blindleistung
        - sensor.meter_1_leistungsfaktor
        - sensor.meter_1_scheinleistung
        - sensor.meter_1_spannung_l1_n
        - sensor.meter_1_spannung_l2_n
        - sensor.meter_1_spannung_l3_n
        - sensor.meter_1_stromstarke
        - sensor.meter_1_stromstarke_l1
        - sensor.meter_1_stromstarke_l2
        - sensor.meter_1_stromstarke_l3

        # --- SolarEdge Wechselrichter Garage: DC-Details, Schein- und Blindleistung,
#       Spannung, Strom, cos phi. Der Tagesertrag laeuft ueber den utility_meter
#       aus der Lebensdauer-Energie und ist nicht betroffen.
        - sensor.garage_solaredge_garage_blindleistung
        - sensor.garage_solaredge_garage_dc_leistung
        - sensor.garage_solaredge_garage_dc_spannung
        - sensor.garage_solaredge_garage_dc_stromstarke
        - sensor.garage_solaredge_garage_leistungsfaktor
        - sensor.garage_solaredge_garage_scheinleistung
        - sensor.garage_solaredge_garage_spannung
        - sensor.garage_solaredge_garage_stromstarke
        # sensor.garage_solaredge_garage_leistung NICHT ausschliessen:
        # Tile "PV Garage" auf der Startseite (Ueberblick).

        # --- Shelly Pro3EM Heizung: Momentanleistungen je Phase und gesamt. Fuer die
#       Heizkennzahl zaehlt allein total_active_energy - der bleibt drin.
        - sensor.pro3em_heizung_phase_a_active_power
        - sensor.pro3em_heizung_phase_a_apparent_power
        - sensor.pro3em_heizung_phase_b_active_power
        - sensor.pro3em_heizung_phase_b_apparent_power
        - sensor.pro3em_heizung_phase_a_power_factor
        - sensor.pro3em_heizung_phase_b_power_factor
        - sensor.pro3em_heizung_phase_c_active_power
        - sensor.pro3em_heizung_phase_c_apparent_power
        - sensor.pro3em_heizung_phase_c_power_factor
        - sensor.pro3em_heizung_total_active_power
        - sensor.pro3em_heizung_total_apparent_power

        # --- Shelly-EM-Kanaele: Momentanleistung, Spannung, cos phi. Die zugehoerigen
#       _energy-Zaehler bleiben (Energie-Dashboard).
        - sensor.it_power
        - sensor.warmwasser_power
        - sensor.warmwasser_power_factor
        - sensor.warmwasser_voltage
        - sensor.waschmaschine_voltage

        # --- WGT: Luftvolumina stehen auf unknown, Drehzahlen werden nirgends ausgewertet.
        - sensor.drehzahl_abluft_wgt
        - sensor.drehzahl_zuluft_wgt
        - sensor.wgt_abluft_total
        - sensor.wgt_zuluft_total

        # --- Momentanwerte der Netz- und PV-Berechnung. Die kWh-Zaehler dahinter bleiben
#       unberuehrt; die Ueberschussregelung liest den Live-State und ist von
#       der Aufzeichnung unabhaengig.
        # calc_grid_export_now / calc_grid_import_now NICHT ausschliessen:
        # Tiles "Strom Import"/"Strom Export" auf der Startseite (Ueberblick).
        - sensor.pv_ueberschuss_mittel_15min

        # --- Abgeleitete Boeen-Sensoren (statistics-Plattform ueber
        #       sensor.ads_wetterwindspeed). Bewusste Ausnahme von der
        #       Regel "Wetterdaten bleiben drin": beide sind RECHENERGEBNISSE
        #       aus einem Sensor, der selbst aufgezeichnet wird - ihre
        #       Historie enthaelt nichts, was sich nicht rekonstruieren
        #       liesse. Sie stecken in keiner Graph-Karte; boe30min wird nur
        #       live in automation.wetterwarnung_windboen gelesen, boe4h nur
        #       als Momentanwert in der Windrose angezeigt. Beides bleibt
        #       funktionsfaehig, weil ein Ausschluss den State nicht beruehrt.
        #       Ersparnis: rund 5.800 Zeilen pro Tag.
        - sensor.wetterwindspeedboe30min
        - sensor.wetterwindspeedboe4h

        # ==================================================================
        # AUFRAEUMEN 10/2026 - zweite Runde, nach denselben vier Pruefungen.
        # Zusaetzlich geprueft: keine statistics-, history_stats- oder
        # filter-Plattform und keine Automation liest die HISTORIE dieser
        # Entities - nur ihren aktuellen State.
        # ==================================================================

        # --- Holzofen-Zwischenwerte (statistics "change" ueber 1 h). Nur
        #       sensor.holzofen_signal liest sie, und zwar live. Beim Start
        #       fuellen sie ihr Fenster aus der Historie ihrer QUELLE
        #       (Raumtemperaturen), nicht aus der eigenen.
        #       Ersparnis: rund 46.700 Zeilen pro Tag.
        - sensor.wohnzimmer_anstieg_1h
        - sensor.referenzraum_anstieg_1h

        # --- Geglaettete Phasenleistung (statistics average_linear). Die
        #       Graph-Karte "Stromverbrauch" zeigt Stundenmittel und liest
        #       dafuer jetzt direkt sensor.meter_1_leistung_l1/_l2/_l3 - deren
        #       Stundenmittel ist dasselbe. Ersparnis: rund 50.000 Zeilen/Tag.
        - sensor.m1_ac_power_a_stat
        - sensor.m1_ac_power_b_stat
        - sensor.m1_ac_power_c_stat

        # --- ADS-Heartbeat: kippt alle ~5 s, die Historie ist ohne Aussage.
        #       automation.system_ads_connection_reboot liest last_changed
        #       aus der State Machine, nicht aus dem Recorder.
        #       Ersparnis: rund 18.300 Zeilen pro Tag.
        - binary_sensor.ads_alive

        # --- Rohwert Giftschrank-Temperatur: aufgezeichnet wird der geglaettete
        #       sensor.giftschrank_werkstatt_temperatur (packages/area/garage.yaml).
        #       Ersparnis: rund 23.000 Zeilen pro Tag.
        - sensor.ads_giftschrankwerkstatt_temp

