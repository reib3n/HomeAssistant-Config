          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[12].datetime | as_datetime | as_local }}

    # ---------------------- BLOCK 2: DAILY FORECAST ----------------------
    - trigger:
        # alle 3 Stunden zur vollen Stunde
        - trigger: time_pattern
          hours: "/3"
          minutes: "0"
        # zusätzlich nach HA-Start
        - trigger: homeassistant
          event: start

      action:
        - action: weather.get_forecasts
          data:
            type: daily
          target:
            entity_id: weather.freudenstadt
          response_variable: forecast_data

      sensor:
        - name: "Forecast Weather Max Temp today"
          unique_id: forecast_weather_max_temp_today
          # Tageshöchstwert für den heutigen Kalendertag (0-24 Uhr).
          # Eintrag wird per Datum gewählt, nicht per festem Index [0]
          # (die Tagesliste kann im Tagesverlauf verrutschen).
          #
          # simple_dwd_weatherforecast liefert für "heute" nur die Stunden ab
          # dem letzten Abruf, nicht ab 0 Uhr (bereits vergangene Stunden
          # fallen aus dem Rohdatensatz). Der rohe Tageswert würde dadurch
          # alle 3h schrumpfen und bereits erreichte Extremwerte verlieren.
          # Daher hier laufendes Maximum: neuer Wert wird nur noch mit dem
          # bisherigen kombiniert, außer beim ersten Abruf des Tages (0 Uhr).
          availability: >
            {{ forecast_data is defined
              and forecast_data.get('weather.freudenstadt')
              and (forecast_data['weather.freudenstadt'].forecast
                   | selectattr('datetime','defined')
                   | selectattr('datetime','search', now().strftime('%Y-%m-%d'))
                   | list | count) > 0 }}
          state: >
            {% set fc = forecast_data['weather.freudenstadt'].forecast %}
            {% set heute = fc | selectattr('datetime','defined')
                 | selectattr('datetime','search', now().strftime('%Y-%m-%d')) | list %}
            {% set neu = (heute[0].temperature if heute else fc[0].temperature) | float(default=None) %}
            {% set alt = states('sensor.forecast_weather_max_temp_today') | float(None) %}
            {% if neu is none %}
              {{ alt if alt is not none else unknown }}
            {% elif alt is none or now().hour == 0 %}
              {{ neu }}
            {% else %}
              {{ [neu, alt] | max }}
            {% endif %}
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Forecast Weather Min Temp today"
          unique_id: forecast_weather_min_temp_today
          # Tagestiefstwert für den heutigen Kalendertag (0-24 Uhr).
          # Eintrag per Datum gewählt (siehe Max-Sensor).
          # Laufendes Minimum aus demselben Grund wie beim Max-Sensor
          # (siehe dortiger Kommentar).
          availability: >
            {{ forecast_data is defined
              and forecast_data.get('weather.freudenstadt')
              and (forecast_data['weather.freudenstadt'].forecast
                   | selectattr('datetime','defined')
                   | selectattr('datetime','search', now().strftime('%Y-%m-%d'))
                   | list | count) > 0 }}
          state: >
            {% set fc = forecast_data['weather.freudenstadt'].forecast %}
            {% set heute = fc | selectattr('datetime','defined')
                 | selectattr('datetime','search', now().strftime('%Y-%m-%d')) | list %}
            {% set neu = (heute[0].templow if heute else fc[0].templow) | float(default=None) %}
            {% set alt = states('sensor.forecast_weather_min_temp_today') | float(None) %}
            {% if neu is none %}
              {{ alt if alt is not none else unknown }}
            {% elif alt is none or now().hour == 0 %}
              {{ neu }}
            {% else %}
              {{ [neu, alt] | min }}
            {% endif %}
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement

        - name: "Forecast Weather Wind today"
          unique_id: forecast_weather_wind_today
          availability: >
            {{ forecast_data is defined
              and forecast_data['weather.freudenstadt'] is defined
              and (forecast_data['weather.freudenstadt'].forecast | length) > 0
              and (forecast_data['weather.freudenstadt'].forecast[0].wind_speed is defined) }}
          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[0].wind_speed
              | float(default=unknown) }}
          unit_of_measurement: "m/s"
          device_class: wind_speed
          state_class: measurement

        - name: "Forecast Weather Regen today"
          unique_id: forecast_weather_regen_today
          availability: >
            {{ forecast_data is defined
              and forecast_data['weather.freudenstadt'] is defined
              and (forecast_data['weather.freudenstadt'].forecast | length) > 0
              and (forecast_data['weather.freudenstadt'].forecast[0].precipitation is defined) }}
          state: >
            {{ forecast_data['weather.freudenstadt'].forecast[0].precipitation
              | float(default=unknown) }}
          unit_of_measurement: "mm"
          state_class: measurement

    # ---------------------- DATE & MONTH CONVERSION ----------------------
    - sensor:
        - default_entity_id: sensor.weekday_german
          state: >-
            {% set wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"] %}
            {{ wochentage[now().weekday()] }}
          name: weekday_german
          unique_id: "weekday_german"
    - sensor:
        - default_entity_id: sensor.date_german
          state: >-
            {% set monat = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"] %}
            {% set monat = monat[now().month - 1] %}
            {{ now().day }}. {{ monat }} {{now().year}}
          name: date_german
          unique_id: "date_german"
