package_recorder:
  # -------------------------------------------------------------------
  # Recorder-Tuning
  # Ziel: Schreiblast/DB-Größe senken, ohne für Charts/Energie relevante
  # Sensoren zu verlieren. purge_keep_days bleibt beim HA-Default (10).
  # -------------------------------------------------------------------
  recorder:
    # Zustände gebündelt alle 30 s in einem Rutsch schreiben statt sofort.
    # Reduziert Disk-I/O deutlich; kein Datenverlust (nur Durability-Fenster
    # von max. 30 s bei einem harten Absturz).
    commit_interval: 30

    exclude:
      entity_globs:
        # SunSpec-Skalierungsfaktoren: praktisch konstant, in der History ohne Aussage
        - sensor.mb_solaredge_*_sf

        # Blockread-Register (Mantissen + mitgelesene SF, siehe packages/solaredge.yaml).
        # Reine Verdrahtung: erst kombiniert ergeben sie einen Wert -> nur die
        # skalierten *_final-Sensoren gehören in die History.
        # Achtung: kein *_final-Sensor enthält "_blk", der Glob trifft sie also nicht.
        - sensor.mb_solaredge_*_blk
        - sensor.mb_solaredge_*_blk_*

      entities:
        # Rohe, UNskalierte Elektro-Detailregister. Erst mit dem passenden SF
        # ergeben sie einen sinnvollen Wert -> die skalierten *_final-Sensoren
        # bleiben aufgezeichnet, die Rohwerte fliegen aus der History.

        # --- Wechselrichter Garage ---
        # Explizit statt Glob: "..._energy_now*" würde sonst auch den
        # aufzuzeichnenden ..._energy_now_final treffen.
        - sensor.mb_solaredge_garage_energy_now
        - sensor.mb_solaredge_garage_energy_now_1
        - sensor.mb_solaredge_garage_ac_current
        - sensor.mb_solaredge_garage_ac_voltage
        - sensor.mb_solaredge_garage_ac_freq

        # --- Zähler M1: Frequenz ---
        # Spannung (m1_volt_blk*) und Leistungsfaktor (m1_fac_blk*) sind
        # Blockreads und werden bereits von den *_blk-Globs oben erfasst.
        - sensor.mb_solaredge_m1_ac_freq
