package_area_house_beschattung_heute:
  # Ein Merker pro Fenster: "wurde heute schon beschattet". Wird von der
  # Beschattung-Automation (Blueprint beschattung/beschattung_fenster.yaml)
  # gesetzt/zurueckgesetzt und dient dort dazu, das Waerme-Gate fuer die
  # Oeffnen-Flanke zu umgehen, wenn die Automation dieses Fenster heute schon
  # angefasst hat (siehe Briefing-Punkt 12 im Blueprint).
  #
  # Fuer alle 12 Beschattungs-Fenster angelegt, auch fuer die sechs, die noch
  # auf der alten Zeitfenster-Logik laufen und dieses Blueprint (noch) nicht
  # nutzen - dort bleibt der Helper vorerst unbenutzt.
  input_boolean:
    beschattung_heute_wohnzimmer:
      name: "Beschattung heute: Wohnzimmer"
      icon: mdi:weather-sunny-off
    beschattung_heute_esszimmer_sud:
      name: "Beschattung heute: Esszimmer Süd"
      icon: mdi:weather-sunny-off
    beschattung_heute_esszimmer_west:
