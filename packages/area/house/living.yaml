package_area_living:
  ### ---------------------------------------------------------------------------
  ### Scripts
  ### ---------------------------------------------------------------------------
  script:
    # Guten Morgen Script
    wohnbereich_guten_morgen:
      alias: "[-Wohnbereich-] Guten Morgen"
      icon: mdi:weather-sunset-up
      mode: single
      sequence:
        - if:
            - condition: numeric_state
              entity_id: sensor.ads_wetterlux
              above: 0
          then:
            - action: cover.open_cover
              metadata: {}
              data: {}
              target:
                entity_id:
                  - cover.kuche
                  - cover.esszimmer_sud
                  - cover.jalousie_esszimmer
                  - cover.wohnzimmer_jalousie
          else:
            - action: light.turn_on
              metadata: {}
              data:
                brightness_pct: 50
              target:
                entity_id: light.mb_esszimmertisch
            - action: light.turn_on
              metadata: {}
              data:
                brightness_pct: 50
              target:
                entity_id: light.marmorlampe
        - action: switch.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: switch.mb_powersocket_fernseher

    # Gute Nacht Script
    wohnbereich_gute_nacht:
      alias: "[-Wohnbereich-] Gute Nacht"
      icon: mdi:weather-sunset-down
      mode: single
      sequence:
        - action: cover.close_cover
          metadata: {}
          data: {}
          target:
            entity_id:
              - cover.kuche
              - cover.esszimmer_sud
        - action: switch.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: switch.mb_powersocket_fernseher
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            entity_id:
              - light.std_lavalampe
              - light.marmorlampe
              - light.mb_wohnzimmer
              - light.mb_esszimmertisch
              - light.mb_esszimmer
              - light.mb_kuche

  template:
    - light:
        - unique_id: mb_esszimmertisch
          turn_on:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1007
                state: true
          turn_off:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1007
                state: false
          set_level:
            - action: modbus.write_register
              data_template:
                hub: Beckhoff
                unit: 1
                address: 2007
                value: "{{ brightness }}"
          default_entity_id: light.mb_esszimmertisch
          name: Esszimmertisch
          level: "{{ (states('sensor.mb_light_esszimmertisch_bright') | int(0) ) }}"
          state: "{{ (states('binary_sensor.mb_light_esszimmertisch_status')) }}"
    - light:
        - unique_id: mb_esszimmer
          turn_on:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1008
                state: true
          turn_off:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1008
                state: false
          set_level:
            - action: modbus.write_register
              data_template:
                hub: Beckhoff
                unit: 1
                address: 2008
                value: "{{ brightness }}"
          default_entity_id: light.mb_esszimmer
          name: Esszimmer
          level: "{{ (states('sensor.mb_light_esszimmer_bright') | int(0) ) }}"
          state: "{{ (states('binary_sensor.mb_light_esszimmer_status')) }}"
    - light:
        - unique_id: mb_wohnzimmer
          turn_on:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1009
                state: true
          turn_off:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1009
                state: false
          set_level:
            - action: modbus.write_register
              data_template:
                hub: Beckhoff
                unit: 1
                address: 2009
                value: "{{ brightness }}"
          default_entity_id: light.mb_wohnzimmer
          name: Wohnzimmer
          level: "{{ (states('sensor.mb_light_wohnzimmer_bright') | int(0) ) }}"
          state: "{{ (states('binary_sensor.mb_light_wohnzimmer_status')) }}"
