          # Zwei Absicherungen:
          #
          # availability meldet die Lampe sauber als nicht verfuegbar,
          # wenn der Modbus-Wert fehlt - das ist die Anzeige-Ebene.
          #
          # state faengt denselben Fall zusaetzlich ab, weil der
