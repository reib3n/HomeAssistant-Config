package_area_house_living:
  template:
    - light:
        - unique_id: mb_esszimmertisch
          turn_on:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1007
                state: true
          turn_off:
            - action: modbus.write_coil
              data_template:
                hub: Beckhoff
                unit: 1
                address: 1007
                state: false
          set_level:
            - action: modbus.write_register
              data_template:
                hub: Beckhoff
                unit: 1
                address: 2007
                value: "{{ brightness }}"
          default_entity_id: light.mb_esszimmertisch
          name: Esszimmertisch
          level: "{{ (states('sensor.mb_light_esszimmertisch_bright') | int(0) ) }}"
          # Zwei Absicherungen:
          #
          # availability meldet die Lampe sauber als nicht verfuegbar,
          # wenn der Modbus-Wert fehlt - das ist die Anzeige-Ebene.
          #
          # state faengt denselben Fall zusaetzlich ab, weil der
          # Zustandsvalidator nur on/off akzeptiert - alles andere wird
          # hier auf off abgebildet. Ohne diese Absicherung loggte HA bei
          # jedem Reload "Received invalid light state: unavailable".
          # (Welche der beiden Massnahmen allein genuegen wuerde, ist
          # nicht isoliert nachgemessen; beide sind fuer sich korrekt.)
          availability: >
            {{ states('binary_sensor.mb_light_esszimmertisch_status') not in
               ['unknown','unavailable','none',''] }}
          state: >
            {% set s = states('binary_sensor.mb_light_esszimmertisch_status') %}
            {{ s if s in ['on','off'] else 'off' }}
