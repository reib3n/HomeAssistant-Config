package_solaredge:
  # packages/solaredge.yaml
  # -------------------------------------------------------------------
  # Package: Solaredge
  # Einbindung PV und Wechselrichter über Modbus
  # -------------------------------------------------------------------

  # 1) MODBUS-INTEGRATION ----------------------------------------------------------------------
  modbus:
    - name: Solaredge
      type: tcp
      host: !secret solaredge_ip
      port: !secret solaredge_port

      sensors:
        # ======= Gemeinsame Defaults (per YAML-Merge) =======
        # Unskaliert, da SunSpec i. d. R. mit separaten SF-Registrern arbeitet.
        # Für Momentanwerte setzen wir state_class: measurement (unverfänglich für Statistik).
        - <<: &U16
            slave: 1
            data_type: uint16
            state_class: measurement
          name: "mb_solaredge_garage_status"
          address: 40107
          scan_interval: 30
          unique_id: "mb_solaredge_garage_status"

        # Einfache int16 Defaults (ohne Einheit, da Skalierungsfaktor separat vorliegt)
        - <<: &I16
            slave: 1
            data_type: int16
            state_class: measurement
          name: "mb_solaredge_garage_temp"
          address: 40103
          scan_interval: 30
          unique_id: "mb_solaredge_garage_temp"

        # ======= WR Garage (SunSpec Inverter) =======
        # Lifetime Energy: kumulativ → total_increasing (Einheit bleibt wie definiert).
        - slave: 1
          name: "mb_solaredge_garage_AC_LifetimeEnergy"
          address: 40093
          scan_interval: 30
          data_type: int32
          device_class: energy
          unit_of_measurement: "Wh" # Hinweis: Rohwert + eigener SF s.u.
          state_class: total_increasing
          unique_id: "mb_solaredge_garage_ac_lifetimeenergy"

        # Momentanleistung: Mantisse (40083) + Skalierungsfaktor (40084).
        # WICHTIG: SolarEdge passt den SF dynamisch an (0 … -5), damit die
        # Mantisse den int16-Bereich ausnutzt. Mantisse und SF MÜSSEN daher aus
        # demselben Modbus-Frame stammen – sonst entstehen Fehler um Faktor 10…1000
        # (typisch in Dämmerung, wenn der SF wechselt).
        # virtual_count: 1 liest 40083+40084 in EINEM Request und erzeugt:
        #   sensor.mb_solaredge_garage_energy_now    -> Mantisse (40083)
        #   sensor.mb_solaredge_garage_energy_now_1  -> SF       (40084)
        # Kein unit/state_class: der Rohwert ist keine Leistung, sondern eine Mantisse.
        - slave: 1
          name: "mb_solaredge_garage_energy_now"
          address: 40083
          scan_interval: 5
          data_type: int16
          virtual_count: 1
          unique_id: "mb_solaredge_garage_energy_now"

        # AC-Strang: Strom, Spannung, Leistung, Frequenz + zugehörige SF
        - <<: *U16
          name: "mb_solaredge_garage_AC-Current"
          address: 40071
          # unit_of_measurement: "A"    # auskommentiert, weil Rohwert; SF folgt separat
          unique_id: "mb_solaredge_garage_ac_current"
        - <<: *I16
          name: "mb_solaredge_garage_AC-Current-SF"
          address: 40075
          unique_id: "mb_solaredge_garage_ac_current_sf"
          scan_interval: 300

        - <<: *U16
          name: "mb_solaredge_garage_AC-Voltage"
          address: 40079
          # unit_of_measurement: "V"
          unique_id: "mb_solaredge_garage_ac_voltage"
        - <<: *I16
          name: "mb_solaredge_garage_AC-Voltage-SF"
          address: 40082
          unique_id: "mb_solaredge_garage_ac_voltage_sf"
          scan_interval: 300

        # 40084 (AC-Power-SF) wird oben zusammen mit 40083 atomar gelesen
        # (mb_solaredge_garage_energy_now_1) – kein separater Sensor mehr.

        - <<: *U16
          name: "mb_solaredge_garage_AC-Freq"
          address: 40085
          # unit_of_measurement: "Hz"
          unique_id: "mb_solaredge_garage_ac_freq"
        - <<: *I16
          name: "mb_solaredge_garage_AC-Freq-SF"
          address: 40086
          unique_id: "mb_solaredge_garage_ac_freq_sf"
          scan_interval: 300

        # Blockread VA / VAR / PF + deren SF (40087…40092) in EINEM Request.
        # Alle drei SF sind dynamisch -> müssen aus demselben Frame stammen.
        #   mb_solaredge_garage_ac_blk    -> 40087  VA
        #   mb_solaredge_garage_ac_blk_1  -> 40088  VA-SF
        #   mb_solaredge_garage_ac_blk_2  -> 40089  VAR
        #   mb_solaredge_garage_ac_blk_3  -> 40090  VAR-SF
        #   mb_solaredge_garage_ac_blk_4  -> 40091  PF
        #   mb_solaredge_garage_ac_blk_5  -> 40092  PF-SF
        - slave: 1
          name: "mb_solaredge_garage_ac_blk"
          address: 40087
          scan_interval: 5
          data_type: int16
          virtual_count: 5
          unique_id: "mb_solaredge_garage_ac_blk"

        - <<: *U16
          name: "mb_solaredge_garage_AC_LifetimeEnergy-SF"
          address: 40095
          unique_id: "mb_solaredge_garage_ac_lifetimeenergy_sf"
          scan_interval: 300

        # DC-Seite: Blockread 40096…40101 in EINEM Request.
        # DC-Strom-SF ist dynamisch (0…-6) -> Atomarität nötig.
        #   mb_solaredge_garage_dc_blk    -> 40096  DC-Strom
        #   mb_solaredge_garage_dc_blk_1  -> 40097  DC-Strom-SF
        #   mb_solaredge_garage_dc_blk_2  -> 40098  DC-Spannung
        #   mb_solaredge_garage_dc_blk_3  -> 40099  DC-Spannung-SF
        #   mb_solaredge_garage_dc_blk_4  -> 40100  DC-Leistung
        #   mb_solaredge_garage_dc_blk_5  -> 40101  DC-Leistung-SF
        # Hinweis: 40096/40098 sind laut SunSpec uint16, werden hier als int16
        # gelesen (ein Block = ein data_type). Reale Mantissen bleiben < 32767;
        # ein negativer Rohwert bedeutet uint16 > 32767 (z. B. 0xFFFF =
        # "not implemented") und wird von der Plausibilitätsprüfung verworfen.
        - slave: 1
          name: "mb_solaredge_garage_dc_blk"
          address: 40096
          scan_interval: 5
          data_type: int16
          virtual_count: 5
          unique_id: "mb_solaredge_garage_dc_blk"

        - <<: *I16
          name: "mb_solaredge_garage_Temp-SF"
          address: 40106
          unique_id: "mb_solaredge_garage_temp_sf"
          scan_interval: 300

        # ======= Strommessgerät 1 (SunSpec Meter) =======
        # Energie-Zähler: kumulativ
        - slave: 1
          name: "mb_solaredge_m1_energy_w_import"
          address: 40234
          scan_interval: 5
          data_type: uint32
          device_class: energy
          unit_of_measurement: "Wh" # Rohwert + eigener SF (40242)
          state_class: total_increasing
          unique_id: "mb_solaredge_m1_energy_w_import"

        - slave: 1
          name: "mb_solaredge_m1_energy_w_export"
          address: 40226
          scan_interval: 5
          data_type: uint32
          device_class: energy
          unit_of_measurement: "Wh" # Rohwert + eigener SF (40242)
          state_class: total_increasing
          unique_id: "mb_solaredge_m1_energy_w_export"

        - <<: *I16
          name: "mb_solaredge_m1_energy_w_SF"
          address: 40242
          unique_id: "mb_solaredge_m1_energy_w_sf"
          scan_interval: 300

        # Leistung (Summe & Phasen) + SF: Blockread 40206…40210, ein Request.
        # m1_ac_power_sf wechselte in 10 Tagen 3971x -> hier war der Fehler am
        # grössten. Summe, Phasen und SF stammen jetzt aus demselben Frame.
        #   mb_solaredge_m1_pwr_blk    -> 40206  Leistung Summe
        #   mb_solaredge_m1_pwr_blk_1  -> 40207  Leistung L1
        #   mb_solaredge_m1_pwr_blk_2  -> 40208  Leistung L2
        #   mb_solaredge_m1_pwr_blk_3  -> 40209  Leistung L3
        #   mb_solaredge_m1_pwr_blk_4  -> 40210  Leistung-SF
        - slave: 1
          name: "mb_solaredge_m1_pwr_blk"
          address: 40206
          scan_interval: 5
          data_type: int16
          virtual_count: 4
          unique_id: "mb_solaredge_m1_pwr_blk"

        # Strom (A, B, C) + SF: Blockread 40191…40194, ein Request.
        #   mb_solaredge_m1_cur_blk    -> 40191  Strom L1
        #   mb_solaredge_m1_cur_blk_1  -> 40192  Strom L2
        #   mb_solaredge_m1_cur_blk_2  -> 40193  Strom L3
        #   mb_solaredge_m1_cur_blk_3  -> 40194  Strom-SF
        - slave: 1
          name: "mb_solaredge_m1_cur_blk"
          address: 40191
          scan_interval: 5
          data_type: int16
          virtual_count: 3
          unique_id: "mb_solaredge_m1_cur_blk"

        # Spannung L1/L2/L3: Blockread 40196…40198, ein Request statt drei.
        #   mb_solaredge_m1_volt_blk    -> 40196  Spannung L1
        #   mb_solaredge_m1_volt_blk_1  -> 40197  Spannung L2
        #   mb_solaredge_m1_volt_blk_2  -> 40198  Spannung L3
        # Der SF (40203) liegt nicht direkt hinter L3 (40199…40202 sind die
        # Leiter-Leiter-Spannungen) und ist nachweislich statisch (-1) -> bleibt
        # ein eigener 300-s-Sensor, Atomarität ist hier nicht nötig.
        - slave: 1
          name: "mb_solaredge_m1_volt_blk"
          address: 40196
          scan_interval: 5
          data_type: int16
          virtual_count: 2
          unique_id: "mb_solaredge_m1_volt_blk"
        - <<: *I16
          name: "mb_solaredge_m1_ac_volt_SF"
          address: 40203
          scan_interval: 300
          unique_id: "mb_solaredge_m1_ac_volt_sf"

        # Frequenz + SF
        - <<: *I16
          name: "mb_solaredge_m1_ac_freq"
          address: 40204
          scan_interval: 5
          unique_id: "mb_solaredge_m1_ac_freq"
        - <<: *I16
          name: "mb_solaredge_m1_ac_freq_SF"
          address: 40205
          scan_interval: 300
          unique_id: "mb_solaredge_m1_ac_freq_sf"

        # Scheinleistung + SF: Blockread 40211…40215, ein Request.
        #   mb_solaredge_m1_app_blk    -> 40211  Scheinleistung Summe
        #   mb_solaredge_m1_app_blk_1  -> 40212  Scheinleistung L1
        #   mb_solaredge_m1_app_blk_2  -> 40213  Scheinleistung L2
        #   mb_solaredge_m1_app_blk_3  -> 40214  Scheinleistung L3
        #   mb_solaredge_m1_app_blk_4  -> 40215  Scheinleistung-SF
        - slave: 1
          name: "mb_solaredge_m1_app_blk"
          address: 40211
          scan_interval: 5
          data_type: int16
          virtual_count: 4
          unique_id: "mb_solaredge_m1_app_blk"

        # Blindleistung + SF: Blockread 40216…40220, ein Request.
        #   mb_solaredge_m1_rea_blk    -> 40216  Blindleistung Summe
        #   mb_solaredge_m1_rea_blk_1  -> 40217  Blindleistung L1
        #   mb_solaredge_m1_rea_blk_2  -> 40218  Blindleistung L2
        #   mb_solaredge_m1_rea_blk_3  -> 40219  Blindleistung L3
        #   mb_solaredge_m1_rea_blk_4  -> 40220  Blindleistung-SF
        - slave: 1
          name: "mb_solaredge_m1_rea_blk"
          address: 40216
          scan_interval: 5
          data_type: int16
          virtual_count: 4
          unique_id: "mb_solaredge_m1_rea_blk"

        # Leistungsfaktor + SF: Blockread 40221…40225, ein Request statt fünf.
        # SF ist hier statisch (-2), der Block spart aber vier Requests und
        # macht die Skalierung nebenbei atomar.
        #   mb_solaredge_m1_fac_blk    -> 40221  Leistungsfaktor Mittel
        #   mb_solaredge_m1_fac_blk_1  -> 40222  Leistungsfaktor L1
        #   mb_solaredge_m1_fac_blk_2  -> 40223  Leistungsfaktor L2
        #   mb_solaredge_m1_fac_blk_3  -> 40224  Leistungsfaktor L3
        #   mb_solaredge_m1_fac_blk_4  -> 40225  Leistungsfaktor-SF
        - slave: 1
          name: "mb_solaredge_m1_fac_blk"
          address: 40221
          scan_interval: 5
          data_type: int16
          virtual_count: 4
          unique_id: "mb_solaredge_m1_fac_blk"
  ################################################################################################
  #
  # 2) TEMPLATE-SENSOREN
  #
  ################################################################################################
  template:
    - sensor:
        # ===== WR GARAGE =====

        # Status Text
        - name: "mb_solaredge_garage_status_text"
          unique_id: "mb_solaredge_garage_status_text"
          icon: mdi:information-outline
          availability: >
            {{ states('sensor.mb_solaredge_garage_status') not in ['unavailable','unknown'] }}
          state: >
            {% set code = states('sensor.mb_solaredge_garage_status')|int(0) %}
            {% set map = {
                1:'Off', 2:'Sleeping', 3:'Starting', 4:'Productive',
                5:'Throttled', 6:'Shutting Down', 7:'Fault', 8:'Maintenance'
              } %}
            {{ map.get(code, 'Unknown') }}

        # Momentanleistung (W)
        # Mantisse + SF kommen aus einem gemeinsamen Modbus-Read (virtual_count).
        # Zusätzliche Plausibilitätsprüfung als Sicherheitsnetz:
        #   - SF ausserhalb -10…+3 (z. B. -32768 = SunSpec "not implemented")
        #   - Ergebnis ausserhalb -100…3200 W. Obergrenze = AC-Nennleistung des WR
        #     (Messreihe: Realwerte enden hart bei ~3000 W). Untergrenze lässt
        #     die geringe Nachtaufnahme des WR zu, falls er sie negativ meldet.
        # Unplausible Samples machen den Sensor kurz 'unavailable' statt einen
        # falschen Wert zu liefern (Recorder/Statistik überspringen ihn dann).
        - name: "mb_solaredge_garage_energy_now_final"
          unique_id: "mb_solaredge_garage_energy_now_final"
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_energy_now') %}
            {% set sf  = states('sensor.mb_solaredge_garage_energy_now_1') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and -100 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 3200 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_energy_now')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_energy_now_1')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # Temperatur (°C)
        - name: "mb_solaredge_garage_temp_final"
          unique_id: "mb_solaredge_garage_temp_final"
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          availability: >
            {{ states('sensor.mb_solaredge_garage_temp') not in ['unavailable','unknown']
              and states('sensor.mb_solaredge_garage_temp_sf') not in ['unavailable','unknown'] }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_temp')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_temp_sf')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # Lifetime Energy (kWh)
        - name: "mb_solaredge_garage_energy_lifetime_final"
          unique_id: "mb_solaredge_garage_energy_lifetime_final"
          unit_of_measurement: "kWh"
          device_class: energy
          state_class: total_increasing
          availability: >
            {{ states('sensor.mb_solaredge_garage_ac_lifetimeenergy') not in ['unavailable','unknown']
              and states('sensor.mb_solaredge_garage_ac_lifetimeenergy_sf') not in ['unavailable','unknown'] }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_lifetimeenergy')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_lifetimeenergy_sf')|float(-1) %}
            {{ (raw * (10 ** sf) / 1000) | round(2) }}

        # DC Current (A)
        - name: "mb_solaredge_garage_dc_current_final"
          unique_id: "mb_solaredge_garage_dc_current_final"
          unit_of_measurement: "A"
          device_class: current
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk') %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_1') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and 0 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 15 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_1')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(2) }}

        # DC Voltage (V)
        - name: "mb_solaredge_garage_dc_voltage_final"
          unique_id: "mb_solaredge_garage_dc_voltage_final"
          unit_of_measurement: "V"
          device_class: voltage
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk_2') %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_3') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and 0 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 600 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk_2')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_3')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # DC Power (W)
        - name: "mb_solaredge_garage_dc_power_final"
          unique_id: "mb_solaredge_garage_dc_power_final"
          unit_of_measurement: "W"
          device_class: power
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk_4') %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_5') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and -100 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 3400 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_dc_blk_4')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_dc_blk_5')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # AC Current (A)
        - name: "mb_solaredge_garage_ac_current_final"
          unique_id: "mb_solaredge_garage_ac_current_final"
          unit_of_measurement: "A"
          device_class: current
          state_class: measurement
          availability: >
            {{ states('sensor.mb_solaredge_garage_ac_current') not in ['unavailable','unknown']
              and states('sensor.mb_solaredge_garage_ac_current_sf') not in ['unavailable','unknown'] }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_current')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_current_sf')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(2) }}

        # AC Voltage (V)
        - name: "mb_solaredge_garage_ac_voltage_final"
          unique_id: "mb_solaredge_garage_ac_voltage_final"
          unit_of_measurement: "V"
          device_class: voltage
          state_class: measurement
          availability: >
            {{ states('sensor.mb_solaredge_garage_ac_voltage') not in ['unavailable','unknown']
              and states('sensor.mb_solaredge_garage_ac_voltage_sf') not in ['unavailable','unknown'] }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_voltage')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_voltage_sf')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # AC Frequency (Hz)
        - name: "mb_solaredge_garage_ac_freq_final"
          unique_id: "mb_solaredge_garage_ac_freq_final"
          unit_of_measurement: "Hz"
          device_class: frequency
          state_class: measurement
          availability: >
            {{ states('sensor.mb_solaredge_garage_ac_freq') not in ['unavailable','unknown']
              and states('sensor.mb_solaredge_garage_ac_freq_sf') not in ['unavailable','unknown'] }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_freq')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_freq_sf')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # AC Scheinleistung (VA)
        - name: "mb_solaredge_garage_ac_va_final"
          unique_id: "mb_solaredge_garage_ac_va_final"
          unit_of_measurement: "VA"
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk') %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_blk_1') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and 0 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 3400 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_blk_1')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # AC Blindleistung (VAR)
        - name: "mb_solaredge_garage_ac_var_final"
          unique_id: "mb_solaredge_garage_ac_var_final"
          unit_of_measurement: "VAR"
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk_2') %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_blk_3') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and -3400 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 3400 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk_2')|float(0) %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_blk_3')|float(-3) %}
            {{ (raw * (10 ** sf)) | round(1) }}

        # Leistungsfaktor (%)
        - name: "mb_solaredge_garage_ac_pf_final"
          unique_id: "mb_solaredge_garage_ac_pf_final"
          unit_of_measurement: "%"
          state_class: measurement
          availability: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk_4') %}
            {% set sf  = states('sensor.mb_solaredge_garage_ac_blk_5') %}
            {{ raw not in ['unavailable','unknown','none']
               and sf  not in ['unavailable','unknown','none']
               and -10 <= sf|float(99) <= 3
               and -100 <= raw|float(-1e9) * (10 ** sf|float(99)) <= 100 }}
          state: >
            {% set raw = states('sensor.mb_solaredge_garage_ac_blk_4')|float(0) %}
