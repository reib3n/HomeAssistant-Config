- id: '1722603963360'
  alias: WGT - Set Fan Level Dropdown
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.aktuelle_luftstufe_wgt
  condition: []
  action:
  - if:
    - condition: numeric_state
      entity_id: sensor.aktuelle_luftstufe_wgt
      below: 1
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Aus
      target:
        entity_id: input_select.wgt_fanlevel
  - if:
    - condition: numeric_state
      entity_id: sensor.aktuelle_luftstufe_wgt
      above: 2
      below: 4
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Stufe 3
      target:
        entity_id: input_select.wgt_fanlevel
  - if:
    - condition: numeric_state
      entity_id: sensor.aktuelle_luftstufe_wgt
      above: 3
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Stufe 4
      target:
        entity_id: input_select.wgt_fanlevel
  - if:
    - condition: numeric_state
      entity_id: sensor.aktuelle_luftstufe_wgt
      below: 2
      above: 0
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Stufe 1
      target:
        entity_id: input_select.wgt_fanlevel
  - if:
    - condition: numeric_state
      entity_id: sensor.aktuelle_luftstufe_wgt
      below: 3
      above: 1
    then:
    - service: input_select.select_option
      metadata: {}
      data:
        option: Stufe 2
      target:
        entity_id: input_select.wgt_fanlevel
  mode: single
- id: '1722606836815'
  alias: WGT - Set Climate Mode from WGT
  description: 'Spiegelt Bedienung am WGT-Bedienteil nach HA. Seit dem hvac_mode_template
    in packages/wgt.yaml leitet climate.wgtmode_template seinen Zustand direkt aus
    den Registern ab; diese Automation ist damit nur noch ein Sicherheitsnetz und
    wird im Normalbetrieb nie auslösen. WICHTIG: Register 100 kennt kein "Kühlen"
    - cool und fan_only sind beide Sommerbetrieb (3). Der Zielmodus wird daher aus
    100 UND 230/232 bestimmt. Die alte Fassung mappte 3 pauschal auf fan_only und
    hat die gerade eingeschaltete Kühlung nach ~8 Sekunden per Registerschreibzugriff
    (232 auf 0) wieder abgeschaltet. Luftstufen-Sync macht "WGT - Set Fan Level Dropdown".'
  triggers:
  - trigger: state
    entity_id:
    - sensor.betriebsart_wgt
    - sensor.wgt_heizen_kuhlen
    - sensor.wgt_kuhlen
    for:
      seconds: 2
  conditions:
  - alias: Nur bei plausibler Rückmeldung
    condition: template
    value_template: '{{ is_number(states(''sensor.betriebsart_wgt'')) and has_value(''climate.wgtmode_template'')
      }}'
  actions:
  - variables:
      ziel: "{% set ba = states('sensor.betriebsart_wgt') | int(-1) %} {% set kuehlt
        = states('sensor.wgt_heizen_kuhlen') | int(-1) == 2\n                and states('sensor.wgt_kuhlen')
        | int(0) == 1 %}\n{{ 'heat' if ba == 2\n   else 'auto' if ba == 4\n   else
        ('cool' if kuehlt else 'fan_only') if ba in [1, 3]\n   else 'off' }}"
  - alias: Nur wenn die HA-Entity vom Gerät abweicht
    condition: template
    value_template: '{{ not is_state(''climate.wgtmode_template'', ziel) }}'
  - alias: HA an das Gerät angleichen
    action: climate.set_hvac_mode
    data:
      hvac_mode: '{{ ziel }}'
    target:
      entity_id: climate.wgtmode_template
  mode: single
