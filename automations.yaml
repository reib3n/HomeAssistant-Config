- id: '1780259261379'
  alias: Gartenbeleuchtung
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    id: EIN
  - trigger: time
    at: 00:00:00
    id: AUS
  - trigger: state
    entity_id:
    - binary_sensor.terassentur
    to:
    - 'off'
    from:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 1
    id: Tür geschlossen
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - EIN
    then:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.std_hang
      data: {}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - AUS
      - condition: state
        entity_id: binary_sensor.terassentur
        state:
        - 'off'
      - condition: state
        entity_id: light.std_hang
        state:
        - 'on'
    then:
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.std_hang
      data: {}
  - if:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Tür geschlossen
      - condition: time
        after: 00:00:00
        before: '10:00:00'
      - condition: state
        entity_id: light.std_hang
        state:
        - 'on'
    then:
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.std_hang
      data: {}
  mode: single
