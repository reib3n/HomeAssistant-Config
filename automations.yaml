      - action: script.eink_display_eg_diele_licht
        metadata: {}
        data:
          modus: Briefkasten
    - conditions:
      - alias: Müll Zeitprüfung
        condition: and
        conditions:
        - condition: trigger
          id:
          - Time
        - condition: state
          entity_id: input_boolean.mullmeldung
          state: 'on'
      sequence:
      - action: script.eink_display_eg_diele_licht
        metadata: {}
        data:
          modus: Müll
    - conditions:
      - condition: trigger
        id:
        - Time
      - condition: state
        entity_id: binary_sensor.ads_briefkasten_full
        state: 'off'
      - condition: state
        entity_id: automation.monitoring_mullmeldung
        state: 'off'
      sequence:
      - action: script.eink_display_eg_diele_licht
        metadata: {}
        data:
          modus: aus
      alias: Ausschalten
  - if:
    - condition: trigger
      id:
      - Belegt
    then:
    - action: notify.notification_group_all_devices
      metadata: {}
      data:
        message: Brief erhalten!
        title: POST
    - action: script.eink_display_eg_diele_licht
      metadata: {}
      data:
        modus: Briefkasten
    alias: Briefkasten gefüllt
  - alias: Briefkasten geleert
    choose:
    - conditions:
      - condition: trigger
        id:
        - Frei
      - condition: state
        entity_id: input_boolean.mullmeldung
        state: 'off'
      sequence:
      - action: script.eink_display_eg_diele_licht
        metadata: {}
        data:
          modus: aus
    - conditions:
      - condition: trigger
        id:
        - Frei
      - condition: state
        entity_id: input_boolean.mullmeldung
        state: 'on'
      sequence:
      - action: script.eink_display_eg_diele_licht
        metadata: {}
        data:
          modus: Müll
  - alias: Müllmeldung deaktivieren
    if:
    - condition: trigger
      id:
      - Müll aus
    then:
    - action: script.eink_display_eg_diele_licht
      metadata: {}
      data:
        modus: aus
  - if:
    - condition: trigger
      id:
      - Müll einschalten
    - condition: state
      entity_id: binary_sensor.ads_briefkasten_full
      state: 'off'
    then:
    - action: script.eink_display_eg_diele_licht
      metadata: {}
      data:
        modus: Müll
    alias: Müllmeldung direkt einschalten
  mode: single
