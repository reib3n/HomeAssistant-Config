wgt_mode_2:
  alias: WGT-Mode
  sequence:
  - if:
    - condition: template
      value_template: '{{modus == "cool"}}'
    then:
    - service: modbus.write_register
      data:
        hub: WGT
        address: 100
        slave: 1
        value:
        - 3
    - alias: Warten bis Sommerbetrieb zurueckgemeldet wird
      wait_template: '{{ states(''sensor.betriebsart_wgt'') | int(-1) in [3, 4] }}'
      timeout: 00:00:30
      continue_on_timeout: true
    - service: modbus.write_register
      data:
        hub: WGT
        address: 230
        slave: 1
        value:
        - 2
    - service: modbus.write_register
      data:
        hub: WGT
        address: 231
        slave: 1
        value:
        - 0
    - service: modbus.write_register
      data:
        hub: WGT
        address: 232
        slave: 1
        value:
        - 1
  - if:
    - condition: template
      value_template: '{{modus == "off"}}'
    then:
    - service: modbus.write_register
      data:
        hub: WGT
        address: 100
        slave: 1
        value:
        - 0
  - if:
    - condition: template
      value_template: '{{modus == "heat"}}'
    then:
    - service: modbus.write_register
      data:
        hub: WGT
        address: 100
        slave: 1
        value:
        - 2
    - alias: Warten bis Winterbetrieb zurueckgemeldet wird
      wait_template: '{{ states(''sensor.betriebsart_wgt'') | int(-1) == 2 }}'
      timeout: 00:00:30
      continue_on_timeout: true
    - service: modbus.write_register
      data:
        hub: WGT
        address: 230
        slave: 1
        value:
        - 1
    - service: modbus.write_register
      data:
        hub: WGT
        address: 231
        slave: 1
        value:
        - 1
    - service: modbus.write_register
      data:
        hub: WGT
        address: 232
        slave: 1
        value:
        - 0
  - if:
    - condition: template
      value_template: '{{modus == "fan_only"}}'
    then:
    - service: modbus.write_register
      data:
        hub: WGT
        address: 230
        slave: 1
        value:
        - 0
    - service: modbus.write_register
      data:
        hub: WGT
        address: 231
        slave: 1
        value:
        - 0
    - service: modbus.write_register
      data:
        hub: WGT
        address: 232
        slave: 1
        value:
        - 0
    - service: modbus.write_register
      data:
        hub: WGT
        address: 100
        slave: 1
        value:
        - 3
  - if:
    - condition: template
      value_template: '{{modus == "auto"}}'
    then:
    - service: modbus.write_register
      data:
        hub: WGT
        address: 100
        slave: 1
        value:
        - 4
  description: ''
  icon: mdi:thermostat-cog
  fields:
    modus:
      selector:
        text:
      name: Modus
      required: true
eink_display_eg_diele_licht:
  sequence:
  - alias: Briefkasten
    if:
    - condition: template
      value_template: '{{modus == "Briefkasten"}}'
    then:
    - action: light.turn_on
      metadata: {}
      data:
        rgb_color:
        - 255
        - 180
        - 63
        effect: Running
        brightness_pct: 50
      target:
        entity_id: light.wled_eg_diele
  - alias: Müll
    if:
    - condition: template
      value_template: '{{modus == "Müll"}}'
    then:
    - action: light.turn_on
      metadata: {}
      data:
        effect: Rainbow
        brightness_pct: 50
      target:
        entity_id: light.wled_eg_diele
  - alias: Ausschalten
    if:
    - condition: template
      value_template: '{{modus == "aus"}}'
    then:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: light.wled_eg_diele
  alias: LED - eInk-EG-Diele
  description: ''
  icon: mdi:alarm-light
  fields:
    modus:
      selector:
        text:
      name: Modus
      required: true
voice_ausgabe_wetterbericht_jetzt:
  sequence:
  - variables:
      temp_jetzt: '{{ states(''sensor.temp_aussen_low'') | float(None) }}'
      temp_min: '{{ [states(''sensor.forecast_weather_min_temp_today'') | float(None),
        temp_jetzt] | reject(''none'') | min }}'
      temp_max: '{{ [states(''sensor.forecast_weather_max_temp_today'') | float(None),
        temp_jetzt] | reject(''none'') | max }}'
  - variables:
      message: 'Die Außentemperatur beträgt aktuell {{ temp_jetzt | round }}°. Die
        Temperaturspanne reicht heute von {{ temp_min | round }}° bis {{ temp_max
        | round }}°.

        {% if is_state(''binary_sensor.ads_wetterrain'', ''on'') %} Es regnet. {%
        endif %}

        {% if states(''sensor.forecast_weather_regen_today'') | float(0) > 0 %} Es
        sollen heute noch {{ states(''sensor.forecast_weather_regen_today'') | round(1)
        }} Liter Regen fallen. {% else %} Es ist kein Regen vorhergesagt. {% endif
        %}

        {% if states(''sensor.stadt_dornstetten_aktuelle_warnstufe'') | int(0) > 0
        %} Aktuell gibt es eine Wetterwarnung vor {{ states(''sensor.dwd_aktuelle_warnungen_text'')}}
        {% endif %}'
  - if:
    - condition: template
      value_template: '{{ (target_device | default('''', true)) | length > 0 }}'
    then:
    - action: assist_satellite.announce
      data:
        message: '{{ message }}'
        preannounce: false
      target:
        device_id: '{{ target_device }}'
  - variables:
      ergebnis:
        message: '{{ message }}'
  - stop: Wetterbericht erstellt
    response_variable: ergebnis
  alias: Voice - Ausgabe - Wetterbericht (jetzt)
  description: Announce current temperature, today's range, rain, and warnings on
    a selected device. Always returns the text as response (message), so callers without
    a satellite can use it as conversation response.
  icon: mdi:weather-cloudy
  mode: single
  fields:
    target_device:
      name: Zielgerät (Device)
      description: Assist-/Satelliten-Gerät für die Ansage. Ohne Gerät wird nur der
        Text zurückgegeben.
      required: false
      selector:
        device:
          multiple: false
