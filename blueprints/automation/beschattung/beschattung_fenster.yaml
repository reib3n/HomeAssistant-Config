blueprint:
  name: Beschattung pro Fenster (Sonnenstand + Saison, Somfy/Tahoma)
  description: >
    Beschattet ein einzelnes Fenster anhand des aktuellen Sonnenstands (Azimut +
    Elevation), der Helligkeit (Lux mit Hysterese) und eines Saison-/Wärme-Gates
    aus dem Wettervorhersage-Höchstwert (optional beschleunigt durch die Innentemperatur).

    Konzept:
      * Beschattet nur, wenn die Sonne dieses Fenster trifft UND der Tag laut
        Vorhersage heiß genug ist (Übergangszeit: Sonne heizt das Haus) UND es
        hell genug ist UND die Sonne tatsächlich durchkommt (Klarheits-Gate).
        Ein bereits zu warmer Raum kann zusätzlich auslösen.
      * Das Klarheits-Gate (Clear-Sky-Index) unterscheidet "hell" von "sonnig":
        ein bedeckter Regentag ist absolut betrachtet hell genug, hat aber keine
        direkte Sonne. Weil der Index auf den Sonnenstand normiert ist, sperrt
        er die tiefstehende Abendsonne trotzdem nicht aus.
      * Fährt wieder hoch, wenn die direkte Sonne wegfällt oder die Lux abends
        unter die Schwelle fallen – ABER nie, wenn der Rollladen komplett
        geschlossen ist (Schläfer-Schutz) oder ein Sleep-Lock aktiv ist.
      * Wind = Vorrang: Zwangsöffnen (Markisenschutz).
      * Fenster/Tür offen = nicht herunterfahren.

    Positionierung gemischt: entweder Somfy "my"-Favorit-Button (RTS, ohne
    Ist-Position) ODER exakte %-Position (io-homecontrol / optimistische
    Template-Cover). Öffnen erfolgt immer per cover.open_cover (RTS + io).

    Hinweis RTS ohne Positions-Feedback: Für den Schläfer-Schutz einen Sleep-Lock
    verdrahten oder ein positionsmeldendes (optimistisches) Cover verwenden.
  domain: automation
  source_url: https://github.com/reib3n/HomeAssistant-Config/blob/main/blueprints/automation/beschattung/beschattung_fenster.yaml

  input:
    # ---------------------------------------------------------------
    aktor:
      name: Aktor / Rollladen
      icon: mdi:window-shutter
      collapsed: false
      input:
        cover:
          name: Cover (Fenster)
          description: Der zu steuernde Rollladen/die Jalousie. Für zuverlässigen Schläfer-Schutz ein Cover mit gemeldeter Position verwenden.
          selector:
            entity:
              filter:
                - domain: cover
        shade_button:
          name: "Somfy 'my'-Favorit-Button (optional, RTS)"
          description: Wenn gesetzt, wird zum Beschatten dieser Button gedrückt (fixe Favoritenstellung) statt eine %-Position gefahren.
          default: {}
          selector:
            entity:
              filter:
                - domain: button
        shade_position:
          name: Beschattungsposition (%)
          description: Nur wenn KEIN Favorit-Button gesetzt ist. 0 = zu, 100 = offen.
          default: 40
          selector:
            number: { min: 0, max: 100, step: 5, unit_of_measurement: "%", mode: slider }
        keep_closed_below:
          name: Komplett-geschlossen-Grenze (%)
          description: Ist die gemeldete Position ≤ diesem Wert, wird NICHT hochgefahren (jemand schläft). Bei Covern ohne Positionsmeldung greift stattdessen der Sleep-Lock.
          default: 5
          selector:
            number: { min: 0, max: 30, step: 1, unit_of_measurement: "%", mode: slider }

    # ---------------------------------------------------------------
    geometrie:
      name: Sonnenstand / Geometrie
      icon: mdi:sun-compass
      collapsed: false
      input:
        azimuth_start:
          name: Azimut Start (°)
          description: Untere Grenze des Himmelsrichtungsbereichs, in dem die Sonne auf dieses Fenster scheint (Nord=0, Ost=90, Süd=180, West=270).
          default: 90
          selector:
            number: { min: 0, max: 360, step: 1, unit_of_measurement: "°", mode: box }
        azimuth_end:
          name: Azimut Ende (°)
          description: Obere Grenze. Wenn Ende < Start, wird der Bereich über 360° hinweg interpretiert.
          default: 270
          selector:
            number: { min: 0, max: 360, step: 1, unit_of_measurement: "°", mode: box }
        elevation_min:
          name: Minimale Sonnenhöhe (°)
          description: Unter dieser Elevation wird nicht beschattet (Sonne zu tief / hinter Horizont oder Hindernis).
          default: 8
          selector:
            number: { min: 0, max: 60, step: 1, unit_of_measurement: "°", mode: slider }
        elevation_max:
          name: Maximale Sonnenhöhe (°)
          description: Über dieser Elevation wird nicht beschattet (z. B. Dachüberstand verschattet die Hochsommer-Mittagssonne ohnehin). 90 = keine Obergrenze.
          default: 90
          selector:
            number: { min: 10, max: 90, step: 1, unit_of_measurement: "°", mode: slider }

    # ---------------------------------------------------------------
    helligkeit:
      name: Helligkeit
      icon: mdi:brightness-6
      collapsed: true
      input:
        lux_sensor:
          name: Helligkeitssensor (Lux)
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
                - domain: sensor
        lux_close:
          name: Beschatten ab (Lux)
          default: 40000
          selector:
            number: { min: 0, max: 120000, step: 1000, unit_of_measurement: "lx", mode: box }
        lux_open:
          name: Öffnen unter (Lux)
          description: Auch die Abend-Schwelle – fällt die Lux hierunter (und keine direkte Sonne), wird hochgefahren. Muss kleiner als "Beschatten ab" sein (Hysterese).
          default: 25000
          selector:
            number: { min: 0, max: 120000, step: 1000, unit_of_measurement: "lx", mode: box }

    # ---------------------------------------------------------------
    himmel:
      name: Direkte Sonne / Bewölkung
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        clarity_sensor:
          name: "Sonnenklarheit (%) – optional"
          description: >
            Clear-Sky-Index, z. B. sensor.sonnenklarheit: gemessene Helligkeit im
            Verhältnis zum wolkenlosen Himmel beim aktuellen Sonnenstand.
            100 % = klar, unter 25 % = Regen/dichte Bewölkung. Im Gegensatz zur
            Lux-Schwelle ist der Wert unabhängig von der Sonnenhöhe und blockiert
            deshalb Regentage, ohne die tiefstehende Abendsonne auszusperren.
            Ohne Sensor entfällt das Gate (Verhalten wie bisher).
          default: {}
          selector:
            entity:
              filter:
                - domain: sensor
        clarity_close:
          name: Beschatten ab Klarheit (%)
          description: >
            Darunter wird nicht beschattet – die Sonne steht zwar richtig, kommt
            aber nicht durch. Pro Fenster einstellen, der Wert ist
            himmelsrichtungsabhängig: für Süd und West liegt der Index an klaren
            Tagen bei 90-100 % (Schwelle 60), im Osten fällt er in den ersten
            Morgenstunden durch Dunst auf 50-60 % ab und braucht deshalb eine
            niedrigere Schwelle (45), sonst bleibt die Morgenbeschattung aus.
          default: 60
          selector:
            number: { min: 0, max: 120, step: 5, unit_of_measurement: "%", mode: slider }
        clarity_open:
          name: Öffnen unter Klarheit (%)
          description: >
            Zieht dauerhaft Bewölkung auf, wird wieder geöffnet. Muss kleiner als
            "Beschatten ab" sein (Hysterese) und sollte über dem Regenwert liegen
            (gemessen: bis 27 %), damit bei Regen auch wirklich geöffnet wird.
          default: 45
          selector:
            number: { min: 0, max: 120, step: 5, unit_of_measurement: "%", mode: slider }

    # ---------------------------------------------------------------
    saison:
      name: Saison / Wärme-Gate
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        forecast_sensor:
          name: Sensor Tages-Höchsttemperatur (Vorhersage)
          description: z. B. sensor.forecast_weather_max_temp_today. Kern des Saison-Gates – an kühlen Vorhersagetagen wird nicht beschattet, damit die Sonne heizt.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        forecast_high_min:
          name: Beschatten erst ab Vorhersage-Höchstwert (°C)
          default: 22
          selector:
            number: { min: 10, max: 40, step: 0.5, unit_of_measurement: "°C", mode: box }
        indoor_sensor:
          name: Innentemperatur-Sensor (optional)
          description: Beschleuniger, kein Blocker – ein Raum über dem Ziel löst auch an einem grenzwertigen Vorhersagetag aus. Ohne Sensor entscheidet allein der Vorhersage-Höchstwert.
          default: {}
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        indoor_target_sensor:
          name: Innentemperatur-Ziel als Sensor (optional)
          description: >
            Liefert die Komfort-Obergrenze als Entity statt als feste Zahl. Gedacht
            fuer sensor.komfort_obergrenze_* (WGT-Zieltemperatur + Offset), damit
            Beschattung und Sommersteuerung nachweislich dieselbe Schwelle benutzen
            und sich nicht widersprechen koennen. Ist er gesetzt, wird der feste
            Wert unten ignoriert - faellt er aus (Modbus weg), greift er wieder.
          default: {}
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        indoor_target:
          name: Innentemperatur-Ziel (°C)
          description: Fester Rueckfallwert. Wird nur verwendet, wenn oben kein Sensor gesetzt ist oder dieser gerade keinen Zahlenwert liefert.
          default: 23
          selector:
            number: { min: 15, max: 30, step: 0.5, unit_of_measurement: "°C", mode: box }
        temp_hysterese:
          name: Temperatur-Hysterese (K)
          description: Erst so viel Grad unter der Schwelle wird wieder geöffnet (verhindert Flattern).
          default: 1.5
          selector:
            number: { min: 0, max: 5, step: 0.5, unit_of_measurement: "K", mode: slider }

    # ---------------------------------------------------------------
    sicherheit:
      name: Sicherheit / Overrides
      icon: mdi:shield-home
      collapsed: true
      input:
        contact_sensor:
          name: Fenster-/Türkontakt (optional)
          description: Ist er offen ('on'), wird NICHT heruntergefahren.
          default: {}
          selector:
            entity:
              filter:
                - domain: binary_sensor
        wind_sensor:
          name: Wind-Sensor (optional)
          description: Windgeschwindigkeit. Ab Schwelle Zwangsöffnen (Markisenschutz).
          default: {}
          selector:
            entity:
              filter:
                - domain: sensor
        wind_threshold:
          name: Wind-Schwelle
          default: 45
          selector:
            number: { min: 0, max: 120, step: 1, unit_of_measurement: "km/h", mode: box }
        sleep_lock:
          name: Sleep-Lock (optional)
          description: Ist dieser Schalter 'on', wird nicht hochgefahren (Schläfer-Schutz für Cover ohne Positionsmeldung, z. B. RTS-Schlafzimmer).
          default: {}
          selector:
            entity:
              filter:
                - domain: [input_boolean, binary_sensor, switch]
        disable_boolean:
          name: Deaktivieren (optional)
          description: Ist dieser Schalter 'on', ruht die komplette Automation (z. B. Urlaub).
          default: {}
          selector:
            entity:
              filter:
                - domain: [input_boolean, binary_sensor, switch]

    # ---------------------------------------------------------------
    tuning:
      name: Feintuning
      icon: mdi:tune
      collapsed: true
      input:
        stagger_max:
          name: Zufalls-Verzögerung max. (s)
          description: Streut die Funkbefehle, damit nicht alle Fenster gleichzeitig senden (Tahoma/RTS-Schonung).
          default: 20
          selector:
            number: { min: 0, max: 60, step: 1, unit_of_measurement: "s", mode: slider }

mode: restart
max_exceeded: silent

variables:
  cover: !input cover
  shade_button: !input shade_button
  shade_position: !input shade_position
  keep_closed_below: !input keep_closed_below
  az_start: !input azimuth_start
  az_end: !input azimuth_end
  elev_min: !input elevation_min
  elev_max: !input elevation_max
  lux_sensor: !input lux_sensor
  lux_close: !input lux_close
  lux_open: !input lux_open
  clarity_sensor: !input clarity_sensor
  clarity_close: !input clarity_close
  clarity_open: !input clarity_open
  forecast_sensor: !input forecast_sensor
  forecast_high_min: !input forecast_high_min
  indoor_sensor: !input indoor_sensor
  indoor_target: !input indoor_target
  indoor_target_sensor: !input indoor_target_sensor
  temp_hysterese: !input temp_hysterese
  contact_sensor: !input contact_sensor
  wind_sensor: !input wind_sensor
  wind_threshold: !input wind_threshold
  sleep_lock: !input sleep_lock
  disable_boolean: !input disable_boolean
  stagger_max: !input stagger_max

  # --- Optionale Inputs erkennen ---
  has_button: "{{ shade_button is string and shade_button | length > 0 }}"
  has_indoor: "{{ indoor_sensor is string and indoor_sensor | length > 0 }}"
  has_target_sensor: "{{ indoor_target_sensor is string and indoor_target_sensor | length > 0 }}"
  has_clarity: "{{ clarity_sensor is string and clarity_sensor | length > 0 }}"
  has_contact: "{{ contact_sensor is string and contact_sensor | length > 0 }}"
  has_wind: "{{ wind_sensor is string and wind_sensor | length > 0 }}"
  has_sleep: "{{ sleep_lock is string and sleep_lock | length > 0 }}"
  has_disable: "{{ disable_boolean is string and disable_boolean | length > 0 }}"

  # --- Sonnenstand / Geometrie ---
  sun_az: "{{ state_attr('sun.sun','azimuth') | float(0) }}"
  sun_el: "{{ state_attr('sun.sun','elevation') | float(0) }}"
  geo_az: >
    {{ (az_start <= sun_az <= az_end) if az_start <= az_end
       else (sun_az >= az_start or sun_az <= az_end) }}
  geo: "{{ geo_az and sun_el >= elev_min and sun_el <= elev_max }}"

  # --- Messwerte ---
  lux: "{{ states(lux_sensor) | float(0) }}"
  forecast_high: "{{ states(forecast_sensor) | float(0) }}"
  indoor: "{{ states(indoor_sensor) | float(-99) if has_indoor else -99 }}"

  # --- Klarheits-Gate (direkte Sonne statt nur "hell") ---
  # Faellt der Sensor aus, wird das Gate bewusst offen gelassen: dann gilt
  # wieder das alte Verhalten (Lux + Waerme) statt gar keiner Beschattung.
  clarity_valid: >
    {{ has_clarity and states(clarity_sensor) not in
       ['unknown','unavailable','none',''] }}
  clarity: "{{ states(clarity_sensor) | float(0) if clarity_valid else -1 }}"
  sun_direct: "{{ (not clarity_valid) or clarity >= clarity_close }}"
  clarity_gone: "{{ clarity_valid and clarity < clarity_open }}"

  # --- Wärme-Gate ---
  # Heißer Tag laut Vorhersage ODER Raum schon über Ziel. Innentemperatur ist
  # Beschleuniger (nie Blocker); die Außentemperatur wird bewusst nicht geprüft
  # (sie ist morgens am Ostfenster kühl, obwohl der Tag heiß wird).
  season_ok: "{{ forecast_high >= forecast_high_min }}"
  # Komfort-Obergrenze: bevorzugt aus dem Sensor, sonst der feste Wert. Der
  # float()-Default faengt unknown/unavailable ab, damit ein Modbus-Aussetzer
  # die Beschattung nicht laehmt, sondern auf das alte Verhalten zurueckfaellt.
  indoor_target_eff: >
    {{ states(indoor_target_sensor) | float(indoor_target)
       if has_target_sensor else indoor_target }}
  heat_gate: "{{ season_ok or (has_indoor and indoor >= indoor_target_eff) }}"
  heat_gone: >
    {{ (not season_ok)
       and ((not has_indoor) or indoor < indoor_target_eff - temp_hysterese) }}

  # --- Zustände / Overrides ---
  pos: "{{ state_attr(cover,'current_position') }}"
  tilt: "{{ state_attr(cover,'current_tilt_position') }}"
  # Bei Lamellen-Jalousien erst bei Position UND Schrägstellung nahe 0 wirklich
  # komplett zu. Rollläden ohne Lamellen liefern kein current_tilt_position ->
  # tilt bleibt None und wird dann nicht mitgeprüft (Verhalten wie bisher).
  fully_closed: >
    {{ pos is not none and (pos | float(100)) <= keep_closed_below
       and (tilt is none or (tilt | float(100)) <= keep_closed_below) }}
  is_open: "{{ pos is not none and (pos | float(0)) >= 99 }}"
  sleeping: "{{ has_sleep and is_state(sleep_lock, 'on') }}"
  contact_open: "{{ has_contact and is_state(contact_sensor, 'on') }}"
  windy: "{{ has_wind and (states(wind_sensor) | float(0) >= wind_threshold) }}"
  disabled: "{{ has_disable and is_state(disable_boolean, 'on') }}"

  block_open: "{{ fully_closed or sleeping }}"

  # --- Wunsch-Aktion ---
  want_shade: >
    {{ geo and heat_gate and sun_direct and (lux >= lux_close) and not contact_open }}
  want_open: >
    {{ (not geo) or (lux < lux_open) or heat_gone or clarity_gone }}
  # nur senden, wenn nötig (schont Tahoma/RTS; bei fehlender Position wird ggf. wiederholt)
  need_shade_cmd: "{{ pos is none or (pos | float(100)) > shade_position + 5 }}"

trigger:
  - trigger: time_pattern
    minutes: "/5"
  # Nur bei echten Schwellen-Übertritten reagieren, nicht bei jedem kleinen
  # Lux-Zappeln. Kurze Entprellzeit gegen einzelne Ausreißer (Sonnenblitz).
  - trigger: numeric_state
    entity_id: !input lux_sensor
    above: !input lux_close
    for: "00:00:30"
  - trigger: numeric_state
    entity_id: !input lux_sensor
    below: !input lux_open
    for: "00:00:30"

condition: []

action:
  - choose:
      # A) Deaktiviert -> nichts tun
      - conditions: "{{ disabled }}"
        sequence: []

      # B) Wind -> Zwangsöffnen (außer komplett geschlossen), Vorrang
      - conditions: "{{ windy and not fully_closed }}"
        sequence:
          - delay: { seconds: "{{ range(0, stagger_max + 1) | random }}" }
          - if: "{{ not is_open }}"
            then:
              - action: cover.open_cover
                target: { entity_id: !input cover }

      # C) Beschatten
      - conditions: "{{ want_shade and not windy and not fully_closed and need_shade_cmd }}"
        sequence:
          - delay: { seconds: "{{ range(0, stagger_max + 1) | random }}" }
          - choose:
              - conditions: "{{ has_button }}"
                sequence:
                  - action: button.press
                    target: { entity_id: !input shade_button }
            default:
              - action: cover.set_cover_position
                target: { entity_id: !input cover }
                data: { position: !input shade_position }

      # D) Öffnen (Abend / Wolken / kühl) -> NICHT wenn komplett geschlossen oder Sleep-Lock
      - conditions: "{{ want_open and not windy and not block_open and not is_open }}"
        sequence:
          - delay: { seconds: "{{ range(0, stagger_max + 1) | random }}" }
          - action: cover.open_cover
            target: { entity_id: !input cover }

    # E) Totband / komplett geschlossen -> Zustand halten
    default: []
