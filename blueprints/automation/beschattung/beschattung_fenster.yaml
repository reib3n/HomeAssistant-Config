blueprint:
  name: Beschattung pro Fenster (Sonnenstand + Saison, Somfy/Tahoma)
  description: "Beschattet ein einzelnes Fenster anhand des aktuellen Sonnenstands
    (Azimut + Elevation), der Helligkeit (Lux mit Hysterese) und eines Saison-/Wärme-Gates
    aus dem Wettervorhersage-Höchstwert (optional beschleunigt durch die Innentemperatur).\nKonzept:\n
    \ * Beschattet nur, wenn die Sonne dieses Fenster trifft UND der Tag laut\n    Vorhersage
    heiß genug ist (Übergangszeit: Sonne heizt das Haus) UND es\n    hell genug ist
    UND die Sonne tatsächlich durchkommt (Klarheits-Gate).\n    Ein bereits zu warmer
    Raum kann zusätzlich auslösen.\n  * Das Klarheits-Gate (Clear-Sky-Index) unterscheidet
    \"hell\" von \"sonnig\":\n    ein bedeckter Regentag ist absolut betrachtet hell
    genug, hat aber keine\n    direkte Sonne. Weil der Index auf den Sonnenstand normiert
    ist, sperrt\n    er die tiefstehende Abendsonne trotzdem nicht aus.\n  * Fährt
    GENAU EINMAL wieder hoch, und zwar auf der Flanke: wenn der\n    Beschattungsgrund
    wegfällt (Sonne zieht weiter, Wolken, Abend-Lux) und\n    für die eingestellte
    Öffnungs-Verzögerung am Stück weggeblieben ist.\n    Ohne diese Flanke wird der
    Behang nicht angefasst – eine manuelle\n    Stellung bleibt deshalb stehen, statt
    alle 5 Minuten überfahren zu\n    werden. Nicht hochgefahren wird bei komplett
    geschlossenem Behang\n    (Schläfer-Schutz) oder aktivem Sleep-Lock.\n  * Wind
    = Vorrang: Zwangsöffnen (Markisenschutz).\n  * Fenster/Tür offen = nicht herunterfahren.\n\nPositionierung
    gemischt: entweder Somfy \"my\"-Favorit-Button (RTS, ohne Ist-Position) ODER exakte
    %-Position (io-homecontrol / optimistische Template-Cover). Öffnen erfolgt immer
    per cover.open_cover (RTS + io).\nHinweis RTS ohne Positions-Feedback: Für den
    Schläfer-Schutz einen Sleep-Lock verdrahten oder ein positionsmeldendes (optimistisches)
    Cover verwenden.\n"
  domain: automation
  source_url: https://github.com/reib3n/HomeAssistant-Config/blob/main/blueprints/automation/beschattung/beschattung_fenster.yaml
  input:
    aktor:
      name: Aktor / Rollladen
      icon: mdi:window-shutter
      collapsed: false
      input:
        cover:
          name: Cover (Fenster)
          description: Der zu steuernde Rollladen/die Jalousie. Für zuverlässigen
            Schläfer-Schutz ein Cover mit gemeldeter Position verwenden.
          selector:
            entity:
              filter:
              - domain:
                - cover
              multiple: false
              reorder: false
        shade_button:
          name: Somfy 'my'-Favorit-Button (optional, RTS)
          description: Wenn gesetzt, wird zum Beschatten dieser Button gedrückt (fixe
            Favoritenstellung) statt eine %-Position gefahren.
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - button
              multiple: false
              reorder: false
        shade_position:
          name: Beschattungsposition (%)
          description: Nur wenn KEIN Favorit-Button gesetzt ist. 0 = zu, 100 = offen.
          default: 40
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 5.0
              unit_of_measurement: '%'
              mode: slider
        keep_closed_below:
          name: Komplett-geschlossen-Grenze (%)
          description: Ist die gemeldete Position ≤ diesem Wert, wird NICHT hochgefahren
            (jemand schläft). Bei Covern ohne Positionsmeldung greift stattdessen
            der Sleep-Lock.
          default: 5
          selector:
            number:
              min: 0.0
              max: 30.0
              step: 1.0
              unit_of_measurement: '%'
              mode: slider
    geometrie:
      name: Sonnenstand / Geometrie
      icon: mdi:sun-compass
      collapsed: false
      input:
        azimuth_start:
          name: Azimut Start (°)
          description: Untere Grenze des Himmelsrichtungsbereichs, in dem die Sonne
            auf dieses Fenster scheint (Nord=0, Ost=90, Süd=180, West=270).
          default: 90
          selector:
            number:
              min: 0.0
              max: 360.0
              step: 1.0
              unit_of_measurement: °
              mode: box
        azimuth_end:
          name: Azimut Ende (°)
          description: Obere Grenze. Wenn Ende < Start, wird der Bereich über 360°
            hinweg interpretiert.
          default: 270
          selector:
            number:
              min: 0.0
              max: 360.0
              step: 1.0
              unit_of_measurement: °
              mode: box
        elevation_min:
          name: Minimale Sonnenhöhe (°)
          description: Unter dieser Elevation wird nicht beschattet (Sonne zu tief
            / hinter Horizont oder Hindernis).
          default: 8
          selector:
            number:
              min: 0.0
              max: 60.0
              step: 1.0
              unit_of_measurement: °
              mode: slider
        elevation_max:
          name: Maximale Sonnenhöhe (°)
          description: Über dieser Elevation wird nicht beschattet (z. B. Dachüberstand
            verschattet die Hochsommer-Mittagssonne ohnehin). 90 = keine Obergrenze.
          default: 90
          selector:
            number:
              min: 10.0
              max: 90.0
              step: 1.0
              unit_of_measurement: °
              mode: slider
    helligkeit:
      name: Helligkeit
      icon: mdi:brightness-6
      collapsed: true
      input:
        lux_sensor:
          name: Helligkeitssensor (Lux)
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - illuminance
              - domain:
                - sensor
              multiple: false
              reorder: false
        lux_close:
          name: Beschatten ab (Lux)
          default: 40000
          selector:
            number:
              min: 0.0
              max: 120000.0
              step: 1000.0
              unit_of_measurement: lx
              mode: box
        lux_open:
          name: Öffnen unter (Lux)
          description: Auch die Abend-Schwelle – fällt die Lux hierunter (und keine
            direkte Sonne), wird hochgefahren. Muss kleiner als "Beschatten ab" sein
            (Hysterese).
          default: 25000
          selector:
            number:
              min: 0.0
              max: 120000.0
              step: 1000.0
              unit_of_measurement: lx
              mode: box
    himmel:
      name: Direkte Sonne / Bewölkung
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        clarity_sensor:
          name: Sonnenklarheit (%) – optional
          description: 'Clear-Sky-Index, z. B. sensor.sonnenklarheit: gemessene Helligkeit
            im Verhältnis zum wolkenlosen Himmel beim aktuellen Sonnenstand. 100 %
            = klar, unter 25 % = Regen/dichte Bewölkung. Im Gegensatz zur Lux-Schwelle
            ist der Wert unabhängig von der Sonnenhöhe und blockiert deshalb Regentage,
            ohne die tiefstehende Abendsonne auszusperren. Ohne Sensor entfällt das
            Gate (Verhalten wie bisher).

            '
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        clarity_close:
          name: Beschatten ab Klarheit (%)
          description: 'Darunter wird nicht beschattet – die Sonne steht zwar richtig,
            kommt aber nicht durch. Pro Fenster einstellen, der Wert ist himmelsrichtungsabhängig:
            für Süd und West liegt der Index an klaren Tagen bei 90-100 % (Schwelle
            60), im Osten fällt er in den ersten Morgenstunden durch Dunst auf 50-60
            % ab und braucht deshalb eine niedrigere Schwelle (45), sonst bleibt die
            Morgenbeschattung aus.

            '
          default: 60
          selector:
            number:
              min: 0.0
              max: 120.0
              step: 5.0
              unit_of_measurement: '%'
              mode: slider
        clarity_open:
          name: Öffnen unter Klarheit (%)
          description: 'Zieht dauerhaft Bewölkung auf, wird wieder geöffnet. Muss
            kleiner als "Beschatten ab" sein (Hysterese) und sollte über dem Regenwert
            liegen (gemessen: bis 27 %), damit bei Regen auch wirklich geöffnet wird.

            '
          default: 45
          selector:
            number:
              min: 0.0
              max: 120.0
              step: 5.0
              unit_of_measurement: '%'
              mode: slider
    saison:
      name: Saison / Wärme-Gate
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        forecast_sensor:
          name: Sensor Tages-Höchsttemperatur (Vorhersage)
          description: z. B. sensor.forecast_weather_max_temp_today. Kern des Saison-Gates
            – an kühlen Vorhersagetagen wird nicht beschattet, damit die Sonne heizt.
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              multiple: false
              reorder: false
        forecast_high_min:
          name: Beschatten erst ab Vorhersage-Höchstwert (°C)
          default: 22
          selector:
            number:
              min: 10.0
              max: 40.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        indoor_sensor:
          name: Innentemperatur-Sensor (optional)
          description: Beschleuniger, kein Blocker – ein Raum über dem Ziel löst auch
            an einem grenzwertigen Vorhersagetag aus. Ohne Sensor entscheidet allein
            der Vorhersage-Höchstwert.
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              multiple: false
              reorder: false
        indoor_target_sensor:
          name: Innentemperatur-Ziel als Sensor (optional)
          description: 'Liefert die Komfort-Obergrenze als Entity statt als feste
            Zahl. Gedacht fuer sensor.komfort_obergrenze_* (WGT-Zieltemperatur + Offset),
            damit Beschattung und Sommersteuerung nachweislich dieselbe Schwelle benutzen
            und sich nicht widersprechen koennen. Ist er gesetzt, wird der feste Wert
            unten ignoriert - faellt er aus (Modbus weg), greift er wieder.

            '
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              multiple: false
              reorder: false
        indoor_target:
          name: Innentemperatur-Ziel (°C)
          description: Fester Rueckfallwert. Wird nur verwendet, wenn oben kein Sensor
            gesetzt ist oder dieser gerade keinen Zahlenwert liefert.
          default: 23
          selector:
            number:
              min: 15.0
              max: 30.0
              step: 0.5
              unit_of_measurement: °C
              mode: box
        temp_hysterese:
          name: Temperatur-Hysterese (K)
          description: Erst so viel Grad unter der Schwelle wird wieder geöffnet (verhindert
            Flattern).
          default: 1.5
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.5
              unit_of_measurement: K
              mode: slider
    sicherheit:
      name: Sicherheit / Overrides
      icon: mdi:shield-home
      collapsed: true
      input:
        contact_sensor:
          name: Fenster-/Türkontakt (optional)
          description: Ist er offen ('on'), wird NICHT heruntergefahren.
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
              multiple: false
              reorder: false
        wind_sensor:
          name: Wind-Sensor (optional)
          description: Windgeschwindigkeit. Ab Schwelle Zwangsöffnen (Markisenschutz).
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        wind_threshold:
          name: Wind-Schwelle
          default: 45
          selector:
            number:
              min: 0.0
              max: 120.0
              step: 1.0
              unit_of_measurement: km/h
              mode: box
        sleep_lock:
          name: Sleep-Lock (optional)
          description: Ist dieser Schalter 'on', wird nicht hochgefahren (Schläfer-Schutz
            für Cover ohne Positionsmeldung, z. B. RTS-Schlafzimmer).
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - input_boolean
                - binary_sensor
                - switch
              multiple: false
              reorder: false
        disable_boolean:
          name: Deaktivieren (optional)
          description: Ist dieser Schalter 'on', ruht die komplette Automation (z.
            B. Urlaub).
          default: {}
          selector:
            entity:
              filter:
              - domain:
                - input_boolean
                - binary_sensor
                - switch
              multiple: false
              reorder: false
    tuning:
      name: Feintuning
      icon: mdi:tune
      collapsed: true
      input:
        open_delay:
          name: Öffnungs-Verzögerung / Pendelschutz (min)
          description: 'Der Beschattungsgrund muss so lange am Stück weggefallen sein,
            bevor hochgefahren wird. Wirkt NUR in Richtung Öffnen – beschattet wird
            weiterhin sofort. Verhindert das Hoch-Runter-Pendeln an durchziehenden
            Wolken. 0 = sofort öffnen.

            '
          default: 20
          selector:
            number:
              min: 0.0
              max: 60.0
              step: 1.0
              unit_of_measurement: min
              mode: slider
        stagger_max:
          name: Zufalls-Verzögerung max. (s)
          description: Streut die Funkbefehle, damit nicht alle Fenster gleichzeitig
            senden (Tahoma/RTS-Schonung).
          default: 20
          selector:
            number:
              min: 0.0
              max: 60.0
              step: 1.0
              unit_of_measurement: s
              mode: slider
mode: queued
max: 5
max_exceeded: silent
trigger_variables:
  t_az_start: !input azimuth_start
  t_az_end: !input azimuth_end
  t_elev_min: !input elevation_min
  t_elev_max: !input elevation_max
  t_lux_sensor: !input lux_sensor
  t_lux_open: !input lux_open
  t_clarity_sensor: !input clarity_sensor
  t_clarity_open: !input clarity_open
  t_forecast_sensor: !input forecast_sensor
  t_forecast_high_min: !input forecast_high_min
  t_indoor_sensor: !input indoor_sensor
  t_indoor_target: !input indoor_target
  t_indoor_target_sensor: !input indoor_target_sensor
  t_temp_hysterese: !input temp_hysterese
variables:
  cover: !input cover
  shade_button: !input shade_button
  shade_position: !input shade_position
  keep_closed_below: !input keep_closed_below
  az_start: !input azimuth_start
  az_end: !input azimuth_end
  elev_min: !input elevation_min
  elev_max: !input elevation_max
  lux_sensor: !input lux_sensor
  lux_close: !input lux_close
  clarity_sensor: !input clarity_sensor
  clarity_close: !input clarity_close
  forecast_sensor: !input forecast_sensor
  forecast_high_min: !input forecast_high_min
  indoor_sensor: !input indoor_sensor
  indoor_target: !input indoor_target
  indoor_target_sensor: !input indoor_target_sensor
  contact_sensor: !input contact_sensor
  wind_sensor: !input wind_sensor
  wind_threshold: !input wind_threshold
  sleep_lock: !input sleep_lock
  disable_boolean: !input disable_boolean
  stagger_max: !input stagger_max
  stagger: '{{ range(0, stagger_max + 1) | random }}'
  has_button: '{{ shade_button is string and shade_button | length > 0 }}'
  has_indoor: '{{ indoor_sensor is string and indoor_sensor | length > 0 }}'
  has_target_sensor: '{{ indoor_target_sensor is string and indoor_target_sensor |
    length > 0 }}'
  has_clarity: '{{ clarity_sensor is string and clarity_sensor | length > 0 }}'
  has_contact: '{{ contact_sensor is string and contact_sensor | length > 0 }}'
  has_wind: '{{ wind_sensor is string and wind_sensor | length > 0 }}'
  has_sleep: '{{ sleep_lock is string and sleep_lock | length > 0 }}'
  has_disable: '{{ disable_boolean is string and disable_boolean | length > 0 }}'
  sun_az: '{{ state_attr(''sun.sun'',''azimuth'') | float(0) }}'
  sun_el: '{{ state_attr(''sun.sun'',''elevation'') | float(0) }}'
  geo_az: "{{ (az_start <= sun_az <= az_end) if az_start <= az_end\n   else (sun_az
    >= az_start or sun_az <= az_end) }}\n"
  geo: '{{ geo_az and sun_el >= elev_min and sun_el <= elev_max }}'
  lux: '{{ states(lux_sensor) | float(0) }}'
  forecast_high: '{{ states(forecast_sensor) | float(0) }}'
  indoor: '{{ states(indoor_sensor) | float(-99) if has_indoor else -99 }}'
  clarity_valid: '{{ has_clarity and has_value(clarity_sensor) }}'
  sun_direct: "{{ (not clarity_valid)\n   or (states(clarity_sensor) | float(0)) >=
    clarity_close }}\n"
  season_ok: '{{ forecast_high >= forecast_high_min }}'
  indoor_target_eff: "{{ states(indoor_target_sensor) | float(indoor_target)\n   if
    has_target_sensor else indoor_target }}\n"
  heat_gate: '{{ season_ok or (has_indoor and indoor >= indoor_target_eff) }}'
  pos: '{{ state_attr(cover,''current_position'') }}'
  tilt: '{{ state_attr(cover,''current_tilt_position'') }}'
  fully_closed: "{{ pos is not none and (pos | float(0)) <= keep_closed_below\n   and
    (tilt is none or (tilt | float(0)) <= keep_closed_below) }}\n"
  is_open: '{{ pos is not none and (pos | float(0)) >= 99 }}'
  sleeping: '{{ has_sleep and is_state(sleep_lock, ''on'') }}'
  contact_open: '{{ has_contact and is_state(contact_sensor, ''on'') }}'
  windy: '{{ has_wind and (states(wind_sensor) | float(0) >= wind_threshold) }}'
  disabled: '{{ has_disable and is_state(disable_boolean, ''on'') }}'
  block_shade: '{{ fully_closed or contact_open }}'
  block_open: '{{ fully_closed or sleeping }}'
  want_shade: '{{ geo and heat_gate and sun_direct and (lux >= lux_close) }}

    '
  need_shade_cmd: "{{ (pos is none or is_open) if has_button\n   else (pos is none
    or (pos | float(0)) > shade_position + 5) }}\n"
trigger:
- trigger: time_pattern
  id: poll
  minutes: /5
- trigger: numeric_state
  id: lux_hoch
  entity_id: !input lux_sensor
  above: !input lux_close
  for: 00:00:30
- trigger: template
  id: shade_end
  for:
    minutes: !input open_delay
  value_template: "{% set sun_az = state_attr('sun.sun','azimuth') | float(0) %} {%
    set sun_el = state_attr('sun.sun','elevation') | float(0) %} {% set geo_az = (t_az_start
    <= sun_az <= t_az_end) if t_az_start <= t_az_end\n                else (sun_az
    >= t_az_start or sun_az <= t_az_end) %}\n{% set geo = geo_az and sun_el >= t_elev_min
    and sun_el <= t_elev_max %} {% set lux = states(t_lux_sensor) | float(0) %} {%
    set has_clarity = t_clarity_sensor is string and t_clarity_sensor | length > 0
    %} {% set clarity_gone = has_clarity and has_value(t_clarity_sensor)\n                      and
    (states(t_clarity_sensor) | float(0)) < t_clarity_open %}\n{% set has_indoor =
    t_indoor_sensor is string and t_indoor_sensor | length > 0 %} {% set has_target
    = t_indoor_target_sensor is string and t_indoor_target_sensor | length > 0 %}
    {% set indoor = states(t_indoor_sensor) | float(-99) if has_indoor else -99 %}
    {% set target = states(t_indoor_target_sensor) | float(t_indoor_target)\n                if
    has_target else t_indoor_target %}\n{% set season_ok = (states(t_forecast_sensor)
    | float(0)) >= t_forecast_high_min %} {% set heat_gate = season_ok or (has_indoor
    and indoor >= target) %} {% set sun_up = sun_el > -6 %} {% set wrap = t_az_start
    > t_az_end %} {% set past_window = (not geo) if wrap else\n                     ((sun_az
    > t_az_end)\n                      or (sun_az >= t_az_start and sun_el < t_elev_min))
    %}\n{% set shade_over = past_window or (sun_el > t_elev_max)\n                    or
    (geo and ((lux < t_lux_open) or clarity_gone)) %}\n{{ heat_gate and sun_up and
    shade_over }}\n"
condition: '{{ not disabled }}'
action:
- choose:
  - conditions: '{{ windy and not fully_closed }}'
    sequence:
    - delay:
        seconds: '{{ stagger }}'
    - if: '{{ not is_open }}'
      then:
      - action: cover.open_cover
        target:
          entity_id: !input cover
  - conditions: '{{ want_shade and not block_shade and need_shade_cmd }}'
    sequence:
    - delay:
        seconds: '{{ stagger }}'
    - choose:
      - conditions: '{{ has_button }}'
        sequence:
        - action: button.press
          target:
            entity_id: !input shade_button
      default:
      - action: cover.set_cover_position
        target:
          entity_id: !input cover
        data:
          position: !input shade_position
  - conditions: "{{ (trigger.id | default('')) == 'shade_end'\n   and not block_open
      and not is_open }}\n"
    sequence:
    - delay:
        seconds: '{{ stagger }}'
    - action: cover.open_cover
      target:
        entity_id: !input cover
